name: One-time PR21 maintained-doc whitespace cleanup

on:
  push:
    branches:
      - feature/launch-presentation-polish
    paths:
      - '.github/workflows/pr21-doc-whitespace-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/launch-presentation-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize maintained document EOF
        shell: python
        run: |
          from pathlib import Path
          for name in ('docs/design-and-lore.md', 'docs/repository-improvement-plan.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              path.write_text(text.rstrip() + '\n', encoding='utf-8', newline='\n')
      - name: Commit whitespace cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/design-and-lore.md docs/repository-improvement-plan.md; then
            echo 'Docs already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git commit -m 'docs: normalize maintained launch doc EOF'
          git push origin HEAD:feature/launch-presentation-polish
