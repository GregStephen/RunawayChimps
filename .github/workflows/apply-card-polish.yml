name: Apply card lifecycle polish
on:
  push:
    branches: [feature/keycard-reader-light-feedback]
    paths: [.github/workflows/apply-card-polish.yml]
permissions:
  contents: write
concurrency:
  group: apply-card-lifecycle-polish
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'GregStephen/RunawayChimps' && github.ref == 'refs/heads/feature/keycard-reader-light-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply hash-verified scoped correction
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('Tools/_apply_card_polish.py')
          text = p.read_text()
          # Correct two transport transcription errors; the applicator still
          # verifies the complete decompressed patch SHA256 before any write.
          text = text.replace('mGoEzEBCnE6', 'mGoEzEmeEBCnE6').replace('Crep3e2p3j5', 'Crep3j5')
          p.write_text(text)
          subprocess.run(['python', str(p)], check=True)
      - name: Install existing syntax-parser dependencies
        run: python -m pip install --disable-pip-version-check 'tree-sitter==0.25.2' 'tree-sitter-c-sharp==0.23.5'
      - name: Run complete source and production-state suite
        run: |
          set -euo pipefail
          grep -Fx 'm_EditorVersion: 2022.3.55f1' ProjectSettings/ProjectVersion.txt
          python Tools/validate_source.py --syntax
          python Tools/validate_repository_integrity.py
          python Tools/validate_level1_contracts.py
          python Tools/validate_keycard_reader_contracts.py
          python Tools/validate_card_reuse.py
          python Tools/validate_interaction_safety.py
          python Tools/validate_pr15_review_hardening.py
          python Tools/validate_security_boot.py
          python Tools/validate_threat_feedback.py
          dotnet run --project Tools/CardSystemHarness/CardSystemHarness.csproj --configuration Release
          python -m compileall -q Tools
          if git grep -n -E '^(<<<<<<< .+|>>>>>>> .+|=======$)' -- .; then exit 1; fi
          git diff --check
      - name: Record executed validation boundary
        shell: python
        run: |
          from pathlib import Path
          import os
          note = ('\n**Validated source/managed result, 2026-09-15 UTC:** Apply card lifecycle polish run `' + os.environ['GITHUB_RUN_ID'] + '` passed the full source suite and production CardConsumptionState harness on this patched worktree based on `' + os.environ['GITHUB_SHA'] + '`. The 49 Unity fixture cases, actual XRI/PhysX/controller input, Photon and headset tests remain unexecuted by this runner. Final published revision and read-only exact-head CI are recorded on PR #23.\n')
          for name in ('docs/design-and-lore.md', 'docs/repository-improvement-plan.md'):
              p = Path(name)
              p.write_text(p.read_text() + note)
      - name: Publish only reviewed code, tests and documents
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Assets/Scripts/HeldItemCollisionMode.cs Assets/Scripts/KeyBox.cs Assets/Scripts/KeyCard.cs Assets/Scripts/KeycardLockProgressIndicator.cs Assets/Scripts/KeycardReaderLightController.cs Assets/Scripts/Utils/RespawnToOriginalSpawn.cs Assets/Tests/CardSystem/CardSystemPlayModeTests.cs Tools/validate_card_reuse.py docs/design-and-lore.md docs/repository-improvement-plan.md docs/keycard-system-reuse.md
          git diff --cached --check
          git commit -m 'Close reusable card authorization, cleanup and reactivation edge cases'
          git push origin HEAD:feature/keycard-reader-light-feedback
