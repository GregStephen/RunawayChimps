name: Temporary keycard docs EOF normalization

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - .github/workflows/temp-keycard-docs-eof.yml

permissions:
  contents: write

jobs:
  normalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback
          fetch-depth: 0
      - name: Normalize maintained docs EOF
        shell: python
        run: |
          from pathlib import Path
          for name in ('docs/design-and-lore.md', 'docs/repository-improvement-plan.md'):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
      - name: Commit normalization and remove temporary workflow
        run: |
          git rm .github/workflows/temp-keycard-docs-eof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git commit -m "Normalize keycard documentation whitespace"
          git push origin HEAD:feature/keycard-reader-light-feedback
