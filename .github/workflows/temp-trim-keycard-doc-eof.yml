name: Temporary keycard docs EOF cleanup

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - '.github/workflows/temp-trim-keycard-doc-eof.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback
          fetch-depth: 0
      - name: Trim maintained docs EOF whitespace
        shell: python
        run: |
          from pathlib import Path
          for name in ('docs/design-and-lore.md', 'docs/repository-improvement-plan.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              path.write_text(text.rstrip() + '\n', encoding='utf-8')
      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-trim-keycard-doc-eof.yml
          git add docs/design-and-lore.md docs/repository-improvement-plan.md .github/workflows/temp-trim-keycard-doc-eof.yml
          git commit -m 'Trim keycard documentation EOF whitespace'
          git push origin HEAD:feature/keycard-reader-light-feedback
