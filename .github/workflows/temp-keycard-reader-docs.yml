name: Temporary keycard reader docs update

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - .github/workflows/temp-keycard-reader-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback
          fetch-depth: 0

      - name: Record confirmed and implemented keycard-reader behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          sections = {
              "docs/design-and-lore.md": "## September 13 keycard-reader accepted-light interaction\n\n**Confirmed interaction:** presenting a physical keycard whose color/symbol identity matches a reader changes that reader's `Status_LED` from standby amber to accepted green while the matching card remains in the reader's scan zone. A non-matching card does not show the accepted state. Removing, disabling, or destroying the last matching card collider returns the reader to standby amber. This interaction is visual feedback only: it does not consume or destroy the card, change inventory or personal-card ownership, open a door, change Level 1 completion, or change Photon ownership.\n\n**Implemented on `feature/keycard-reader-light-feedback`:** `KeycardReaderLightController` is attached to `Reader_Base` at `ScanTarget_FRONT`, so the four color/symbol reader variants inherit the same scan logic. The controller infers Amber Triangle, Cyan Three Bars, Red Circle, or Violet Diamond identity from the canonical reader/card names, with an explicit reader credential override available in the component. The scan target stays `Untagged` rather than using the legacy `KeyBox` tag, preventing the old `KeyCard` path from consuming a card. The LED swaps between the existing serialized built-in-pipeline `LED_Standby_Amber` and `LED_Accepted_Green` materials; no runtime shader or material is created.\n\n**Pending validation:** Unity 2022.3.55f1 import/compile, all four correct-card pairings, the wrong-card pairing matrix, enter/exit/reset behavior, held-card/XR trigger delivery, exact scan-volume fit at Gorilla scale, interaction with the existing personal-card lifecycle, two-client Photon behavior, and Quest/headset presentation remain unvalidated. A presented card still needs a Collider, and Unity trigger delivery requires a Rigidbody on one of the participating objects; XR-grabbable cards normally satisfy that requirement, but the imported card setup must be verified in Unity before this interaction is marked validated.",
              "docs/repository-improvement-plan.md": "## September 13 keycard-reader accepted-light implementation\n\n**Confirmed requested behavior:** a physical card with the same color/symbol credential as a reader should visibly confirm the match by changing that reader's status light from standby amber to accepted green. A wrong card should not show the accepted state. For this first pass, the light feedback is intentionally separate from door opening, card consumption, inventory mutation, Level 1 completion, and Photon ownership.\n\n**Implemented on `feature/keycard-reader-light-feedback`:** new `Assets/Scripts/KeycardReaderLightController.cs` owns the local reader-light state. `Reader_Base.prefab` now gives `ScanTarget_FRONT` a trigger volume and the controller, with serialized references to the existing `Status_LED`, `LED_Standby_Amber`, and `LED_Accepted_Green` assets. All four reader variants inherit that wiring. Matching uses the canonical Amber Triangle, Cyan Three Bars, Red Circle, and Violet Diamond names, normalized so separators/case do not matter; the reader also exposes an explicit credential override. Multiple colliders from one or more matching cards are tracked so one exiting collider cannot incorrectly clear an accepted state while another matching collider remains. The target stays untagged so the legacy `KeyCard`/`KeyBox` consumption behavior is not invoked.\n\n**Validation boundary:** this is source/prefab implementation only. Unity 2022.3.55f1 must still import and compile the branch and prove the trigger receives the actual held-card colliders/Rigidbody setup. Test every matching pair, representative wrong pairs (preferably the full 4x4 matrix), removal/disable/destruction reset to amber, repeated entries, the base/template reader's non-matching default, personal-card drop/recovery behavior, two-client Photon sessions, and headset/Quest visibility. Do not mark the interaction validated until those checks pass."
          }
          for raw_path, section in sections.items():
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              heading = section.splitlines()[0]
              if heading not in text:
                  path.write_text(text.rstrip() + "\n\n" + section.rstrip() + "\n", encoding="utf-8")
          PY
          git rm .github/workflows/temp-keycard-reader-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          if ! git diff --cached --quiet; then
            git commit -m "Document keycard reader light feedback"
            git push origin HEAD:feature/keycard-reader-light-feedback
          fi
