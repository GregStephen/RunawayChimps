          " room_height=ROOM_HEIGHT,wall_thickness=.2,room_dimensions='Wall centreline dimensions',\n objective='Restore exit power with four personal hand-held fuses',fuse_count=4,\n fuse_search_noise='Opening fuse containers and dropping fuses are audible Listener investigation events',\n charge_interaction='Insert a fuse, then hold its nearby lever while a sustained charge noise attracts the Listener; exact charge duration is tuning',\n rooms=rooms,colors=COLORS,nodes=nodes,gates=gate_manifest)")

          # --- Gate placement ---
          replace('Tools/Level2Blockout/gate_integration.py',
          "dict(name='Repair_Bypass_Frame_Only',center_x=33,z=24,scale=CHASE_SCALE,y=2.16,frame_only=True,axis='z'),",
          "dict(name='Repair_Bypass_Frame_Only',center_x=33,z=22,scale=CHASE_SCALE,y=2.16,frame_only=True,axis='z'),")

          # --- Source/route validator ---
          path='Tools/Level2Blockout/validate_level2.py'
          replace(path,
          "assert d['room_height']==5.0 and d['open_passage_wall_gap_width']==4.0\nassert len(manifest['gates'])==5",
          "assert d['room_height']==5.0 and d['open_passage_wall_gap_width']==4.0\nassert d['fuse_count']==4 and 'four personal' in d['objective'].lower()\nassert len(manifest['gates'])==5")
          replace(path,
          "for required in ['Level2_Blockout_v04','Level2EntrySpawn','HubReturnControlMarker','Return_To_Security_Button','RepairStrikeOrigin']:",
          "for required in ['Level2_Blockout_v04','Level2EntrySpawn','HubReturnControlMarker','Return_To_Security_Button','PowerIslandCenter','FuseChargeNoiseOrigin','Fuse1Start','Fuse2Start','Fuse3Start','Fuse4Start','Power_Island_Core']:")
          replace(path,
          "human_targets={'test_hall':(10,6),'service':(24,7),'west_observation':(4,19),'conditioning':(16,19),'east_bypass':(33,16),'north_gallery':(14,28),'repair_lab':(28,28),'exit_approach':(4,24.2)}\ngiant_targets={'test_hall':(10,3),'service':(24,7),'west_observation':(4,19),'conditioning':(16,19),'east_bypass':(33,16),'north_gallery':(14,28),'repair_lab':(28,28)}",
          "human_targets={'test_hall':(10,6),'service':(24,7),'west_observation':(4,18),'conditioning':(16,18),'east_bypass':(33,16),'north_gallery':(14,27),'repair_lab':(28,27),'exit_approach':(4,22.2),\n 'fuse_1_cache':(2.4,10.4),'fuse_2_cache':(25.5,11.5),'fuse_3_cache':(2.4,19.4),'fuse_4_cache':(26,19.4),\n 'island_west':(24.2,27),'island_east':(31.8,27),'island_south':(28,23.6),'island_north':(28,30.4)}\ngiant_targets={'test_hall':(10,3),'service':(24,7),'west_observation':(4,18),'conditioning':(16,18),'east_bypass':(33,16),'north_gallery':(14,27),'repair_lab':(28,27),\n 'island_west':(24.2,27),'island_east':(31.8,27),'island_south':(28,23.6),'island_north':(28,30.4)}")
          replace(path,
          "gallery_cut=(19.9,26,20.1,30); bypass_cut=(31,23.9,35,24.1)\n    assert reachable(flood(radius,body_height,virtual_blockers=(gallery_cut,)),(28,28)),(label,'gallery cut')\n    assert reachable(flood(radius,body_height,virtual_blockers=(bypass_cut,)),(28,28)),(label,'bypass cut')",
          "gallery_cut=(19.9,26,20.1,30); bypass_cut=(31,21.9,35,22.1)\n    assert reachable(flood(radius,body_height,virtual_blockers=(gallery_cut,)),(28,27)),(label,'gallery cut')\n    assert reachable(flood(radius,body_height,virtual_blockers=(bypass_cut,)),(28,27)),(label,'bypass cut')")
          replace(path,
          "results['temporary_barriers']={'closed_exit_separates_safe_exit':True,'locked_reward_room_separate':True,'reward_reachable_when_blocker_removed':True}",
          "results['temporary_barriers']={'closed_exit_separates_safe_exit':True,'locked_reward_room_separate':True,'reward_reachable_when_blocker_removed':True}\nresults['fuse_power_objective']={'fuse_count':4,'all_cache_approaches_reachable':True,'player_and_listener_can_circle_power_island':True,'charge_noise_gameplay':'pending runtime wiring'}")

          # --- Floorplan renderer: replace with objective-aware diagram. ---
          Path('Tools/Level2Blockout/draw_plan.py').write_text(r'''\"\"\"Draw the exact v0.4 fuse-power Level 2 top-down blockout from layout.json.\"\"\"
from pathlib import Path
