name: Apply confirmed Level 2 fuse-power objective

on:
  push:
    branches:
      - design/level2-expanded-map-v04
    paths:
      - .github/workflows/level2-fuse-objective.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/level2-expanded-map-v04
          fetch-depth: 0

      - name: Revise Level 2 objective and blockout source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          # --- Blockout generator ---
          path='Tools/Level2Blockout/build_level2.py'
          replace(path,
          "repair=group('05_Repair_Station__Visual_Only',root); shutter=group('06_Exit_Shutter__Historical_Inactive',root)\ndetails=group('07_Trim_and_Wayfinding',root); markers=group('08_Gameplay_Markers__Not_Wired',root)\nscale_group=node('09_Listener_Size_Guide__Enable_to_Check_Fit',root,active=False,kind='empty')\nlights=group('10_Blockout_Lighting',root); gates=group('11_Existing_SciFi_Gates',root)\nreward=group('12_Optional_Reward_Room__Visual_Only',root)",
          "repair=group('05_Power_Distribution_Island__Visual_Only',root); shutter=group('06_Exit_Shutter__Historical_Inactive',root)\ndetails=group('07_Trim_and_Wayfinding',root); markers=group('08_Gameplay_Markers__Not_Wired',root)\nscale_group=node('09_Listener_Size_Guide__Enable_to_Check_Fit',root,active=False,kind='empty')\nlights=group('10_Blockout_Lighting',root); gates=group('11_Existing_SciFi_Gates',root)\nreward=group('12_Optional_Reward_Room__Visual_Only',root)\nfuse_search=group('13_Fuse_Search_Containers__Visual_Only',root)")

          replace(path,
          " ('West_Observation_Wing',0,8,14,24,'Floor'),\n ('Conditioning_Hall_B',8,30,14,24,'Floor'),\n ('East_Bypass',30,36,2,24,'BypassFloor'),\n ('Exit_Approach',0,8,24,26,'Floor'),\n ('Completed_Exit',0,8,26,32,'SafeFloor'),\n ('North_Gallery',8,20,24,32,'BypassFloor'),\n ('Repair_Lab',20,36,24,32,'RepairFloor'),",
          " ('West_Observation_Wing',0,8,14,22,'Floor'),\n ('Conditioning_Hall_B',8,30,14,22,'Floor'),\n ('East_Bypass',30,36,2,22,'BypassFloor'),\n ('Exit_Approach',0,8,22,26,'Floor'),\n ('Completed_Exit',0,8,26,32,'SafeFloor'),\n ('North_Gallery',8,20,22,32,'BypassFloor'),\n ('Repair_Lab',20,36,22,32,'RepairFloor'),")

          replace(path,
          "doorwall_v('Repair_Gallery_Door',20,24,32,[(26,30)],'Amber',4.2)\ndoorwall_h('Repair_Bypass_Door',24,30,36,[(31,35)],'Amber',4.2)\n# Internal route partitions. Openings deliberately create multiple loops.\ndoorwall_v('Test_Service_Divider',18,0,14,[(3.5,8.5)],'Amber',4.1)\ndoorwall_h('Hall_Middle_Divider',14,0,30,[(2,6),(11,16),(22,27)],'Amber',4.1)\ndoorwall_v('Observation_Conditioning_Divider',8,14,24,[(17,22)],'Amber',4.1)\ndoorwall_v('Service_Bypass_Divider',30,2,14,[(5,10)],'Amber',4.1)\ndoorwall_v('Conditioning_Bypass_Divider',30,14,24,[(17,22)],'Amber',4.1)\ndoorwall_h('Conditioning_Gallery_Divider',24,8,30,[(12,17)],'Amber',4.1)\nwall('Exit_Approach_East',(8,24),(8,26))",
          "doorwall_v('Repair_Gallery_Door',20,22,32,[(26,30)],'Amber',4.2)\ndoorwall_h('Repair_Bypass_Door',22,30,36,[(31,35)],'Amber',4.2)\n# Internal route partitions. Openings deliberately create multiple loops.\ndoorwall_v('Test_Service_Divider',18,0,14,[(3.5,8.5)],'Amber',4.1)\ndoorwall_h('Hall_Middle_Divider',14,0,30,[(2,6),(11,16),(22,27)],'Amber',4.1)\ndoorwall_v('Observation_Conditioning_Divider',8,14,22,[(17,21)],'Amber',4.1)\ndoorwall_v('Service_Bypass_Divider',30,2,14,[(5,10)],'Amber',4.1)\ndoorwall_v('Conditioning_Bypass_Divider',30,14,22,[(17,21)],'Amber',4.1)\ndoorwall_h('Conditioning_Gallery_Divider',22,8,30,[(12,17)],'Amber',4.1)\nwall('Exit_Approach_East',(8,22),(8,26))")

          old="""# Repair station on north wall, away from both escape gates.
node('Workbench_Top',repair,(28,1.0,31.45),(3.2,.14,.65),'Metal',True)
for x in [26.65,29.35]: node('Workbench_Leg',repair,(x,.47,31.45),(.12,.94,.5),'Metal',True)
node('Jammed_Release_Housing',repair,(28,1.45,31.38),(1.0,.75,.42),'Amber',True)
node('Strike_Plate',repair,(28,1.88,31.35),(.34,.10,.34),'LightStrip',True)
node('Hammer_Handle__Placeholder',repair,(29.0,1.10,31.42),(.05,.05,.45),'Concrete')
node('Hammer_Head__Placeholder',repair,(29.0,1.13,31.2),(.28,.15,.13),'Metal')
node('Conduit_Up',details,(28,3.0,31.78),(.07,2.4,.07),'Amber')
node('Conduit_West',details,(14,4.2,31.78),(28,.07,.07),'Amber')
node('Conduit_Down_To_Exit',details,(4,4.2,28.9),(.07,.07,5.8),'Amber')
"""
