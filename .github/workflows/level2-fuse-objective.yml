name: Apply confirmed Level 2 fuse-power objective

on:
  push:
    branches:
      - design/level2-expanded-map-v04
    paths:
      - .github/workflows/level2-fuse-objective.yml
      - Tools/Level2Blockout/apply_fuse_objective.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/level2-expanded-map-v04
          fetch-depth: 0
      - name: Apply confirmed fuse objective changes
        run: python Tools/Level2Blockout/apply_fuse_objective.py
      - name: Regenerate Level 2 scene and prefab
        run: python Tools/Level2Blockout/build_level2.py
      - name: Validate fuse objective geometry and source
        run: python Tools/Level2Blockout/validate_level2.py
      - name: Check generated diff
        run: git diff --check
      - name: Commit completed fuse objective blockout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/level2-fuse-objective.yml Tools/Level2Blockout/apply_fuse_objective.py
          git add Assets/RunawayChimps/Level2Blockout Tools/Level2Blockout docs
          git commit -m "Replace Level 2 hammer objective with four-fuse power loop"
          git push origin HEAD:design/level2-expanded-map-v04
