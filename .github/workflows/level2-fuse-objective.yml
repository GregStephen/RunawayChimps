 node(f'Fuse_{i}_Personal_Cylindrical_Placeholder',fuse_search,(x,.78,z-.52),(.18,.36,.18),'Amber',kind='cylinder')
 node(f'Fuse{i}Start',markers,(x,.78,z-.52),kind='empty')
"""
          replace(path,old,new)

