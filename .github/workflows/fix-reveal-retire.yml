name: Fix final reveal retirement edge

on:
  push:
    branches:
      - feature/launch-presentation-polish
    paths:
      - 'Tools/_fix_reveal_retire.py'
      - '.github/workflows/fix-reveal-retire.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/launch-presentation-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python Tools/_fix_reveal_retire.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Scripts/Loading/SecurityBootPresentation.cs
          git commit -m 'fix: retire workstation unconditionally on final reveal'
          git push origin HEAD:feature/launch-presentation-polish
