name: Record source validation docs

on:
  push:
    paths:
      - '.github/workflows/record-source-validation-docs.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-level1-crawler-lighting

      - name: Record CI implementation in maintained docs
        shell: python
        run: |
          from pathlib import Path

          design = Path('docs/design-and-lore.md')
          text = design.read_text(encoding='utf-8')
          note = """**September 12 automated source-validation follow-up:** PR #11 now adds a repository-wide, read-only GitHub Actions `Source integrity` check through `.github/workflows/source-validation.yml`. It verifies the declared Unity 2022.3.55f1 version, runs `Tools/validate_source.py --syntax`, compiles tracked Python tools, and checks the full PR/push diff for whitespace errors. Its first runs caught and led to fixes for a malformed Level 2 floorplan drawing script and trailing whitespace in three newly added Unity metadata files; after those corrections both push and pull-request runs passed. This is source/serialization/tooling validation only and does **not** replace Unity import/compile, the Editor validators, Play Mode, Photon, XR/headset, or Quest performance testing. See [Automated source validation](ci-validation.md).\n\n"""
          anchor = '## Decision and correction record\n'
          if note not in text:
              if anchor not in text:
                  raise SystemExit('design anchor missing')
              text = text.replace(anchor, note + anchor, 1)
              design.write_text(text, encoding='utf-8')

          plan = Path('docs/repository-improvement-plan.md')
          text = plan.read_text(encoding='utf-8')
          section = """## September 12 automated source validation\n\n**Implemented on `codex/fix-level1-crawler-lighting`:** `.github/workflows/source-validation.yml` adds the read-only **Source integrity** GitHub Actions gate for every pull request, pushes to `main`, `codex/**` and `design/**`, and manual dispatches. It pins Python/tree-sitter dependencies, verifies `ProjectVersion.txt` still declares Unity 2022.3.55f1, runs `python Tools/validate_source.py --syntax`, compiles tracked Python tools, and applies `git diff --check` to the complete PR or pushed range.\n\n**First CI findings and completed fixes:** the first run passed the Unity-version and core source validator but exposed an existing syntax error in `Tools/Level2Blockout/draw_plan.py`, where intended multiline labels contained literal newlines inside single-quoted strings. That script was repaired to use escaped newlines. The next pull-request run exposed trailing whitespace in the new `RigFloorPenetrationGuard`, `VentHeadlampController`, and `CrawlerBodyPathFollower` `.meta` files; those files were normalized rather than weakening the check. After those corrections, both push and pull-request Source integrity runs passed on September 12. At that checkpoint `validate_source.py --syntax` reported 116 first-party C# scripts and 5 enabled scenes passing component-name, metadata/GUID, build-registration, local-reference and C# syntax checks.\n\n**Validation boundary:** this new green check is meaningful source evidence, but it is **not** Unity/runtime validation. It does not import or compile in Unity, execute the two Runaway Chimps Editor validators, run Play Mode, open Photon sessions, exercise XR interactions, build for Quest, or measure headset performance. Keep all existing Unity/Photon/headset acceptance checks pending until they are actually run. A future Unity-aware CI tier is optional and should be added only when its hosted Unity licensing/setup cost is justified. See `docs/ci-validation.md`.\n\n"""
          anchor = '## September 11 Hub and Level 1 spawn/arrival stability follow-up\n'
          if section not in text:
              if anchor not in text:
                  raise SystemExit('plan anchor missing')
              text = text.replace(anchor, section + anchor, 1)
              plan.write_text(text, encoding='utf-8')

      - name: Commit maintained docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Record automated source validation status'
            git push origin HEAD:codex/fix-level1-crawler-lighting
          fi
