name: Temporary keycard validation result record

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - .github/workflows/temp-keycard-validation-record.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback
          fetch-depth: 0
      - name: Append validation result to maintained docs
        shell: python
        run: |
          from pathlib import Path

          notes = {
              'docs/design-and-lore.md': '''\n\n**Validation update, 2026-09-14 (supersedes the pending Source Integrity wording above):** PR #23 Source Integrity passed with the focused keycard-reader contracts, C# syntax, repository integrity, Level 1 contracts, merge-marker, and whitespace checks green. Runtime validation remains pending: Unity 2022.3.55f1 import/compile, first Amber card -> 1/2, second distinct Amber card -> 2/2 and existing completion travel, wrong-credential rejection, direct legacy-KeyBox rejection, two-client Photon independence, and Quest/headset presentation.\n''',
              'docs/repository-improvement-plan.md': '''\n\n**Validation update, 2026-09-14 (supersedes the pending Source Integrity wording above):** PR #23 Source Integrity passed, including `Tools/validate_keycard_reader_contracts.py` plus the repository-wide source/integrity checks. Runtime validation remains pending: Unity 2022.3.55f1 import/compile, all matching/wrong-card scans, 0/2 -> 1/2 -> 2/2 persistence, direct legacy-box rejection, card consumption, Level 1 travel, two-client Photon checks, and headset/Quest presentation.\n''',
          }
          marker = '**Validation update, 2026-09-14 (supersedes the pending Source Integrity wording above):** PR #23 Source Integrity passed'
          for filename, note in notes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  text = text.rstrip() + note
              path.write_text(text.rstrip() + '\n', encoding='utf-8')
      - name: Commit docs and remove temporary workflow
        run: |
          git rm .github/workflows/temp-keycard-validation-record.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git commit -m "Record keycard reader validation result"
          git push origin HEAD:feature/keycard-reader-light-feedback
