name: One-off vent blower doc sync

on:
  push:
    branches:
      - feature/level1-vent-blower

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/level1-vent-blower
          fetch-depth: 0

      - name: Record confirmed vent blower design and implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          design = Path('docs/design-and-lore.md')
          text = design.read_text(encoding='utf-8')

          paragraph = '''**September 12 Level 1 VentRoom set-piece correction/implementation:** Greg explicitly confirmed that the existing Level 1 vent geometry and route must **not** be redesigned. The already-authored widened/taller `VentRoom` is a short equipment bay inside the same tunnel: the vent flares out, stays enlarged briefly, then returns to the original tunnel shape. PR #17 (`feature/level1-vent-blower`) source-implements a wall-mounted industrial blower against the widened side wall without changing `VentRoom` geometry, floor space, routes, zone rules or Crawler navigation. `VentBlowerSetPiece` builds a chunky six-blade fan, guard, housing and conduit; rotates only the decorative rotor; adds a dim shadowless red maintenance point light; and plays a localized procedural 3D motor/thrum loop intended to give this chamber a distinct identity and partially mask distant Crawler audio nearby. Generated blower geometry has colliders disabled and does not carve the NavMesh. Unity 2022.3.55f1 import/compile, in-headset scale/clearance, visual placement, audio balance, Crawler traversal, two-client behavior and Quest performance remain pending validation.\n\n'''
          marker = '**September 12 automated source-validation follow-up:**'
          if paragraph.strip() not in text:
              if marker not in text:
                  raise SystemExit('design implementation marker not found')
              text = text.replace(marker, paragraph + marker, 1)

          table_marker = '| --- | --- | --- |\n'
          table_row = '| 2026-09-12 | Preserve the existing Level 1 vent layout. Use the already-widened/taller `VentRoom` only as an equipment/set-piece bay: add a wall-mounted industrial blower with a dim red maintenance light and localized machinery sound, while leaving the tunnel route and geometry unchanged. | Confirmed from Greg’s explicit correction and approval; source-implemented on `feature/level1-vent-blower` / PR #17 through `VentBlowerSetPiece`. Decorative geometry is non-colliding and does not alter Crawler navigation. Unity 2022.3.55f1/headset/audio/Crawler/Quest validation pending. |\n'
          if table_row.strip() not in text:
              if table_marker not in text:
                  raise SystemExit('design decision table marker not found')
              text = text.replace(table_marker, table_marker + table_row, 1)

          text = text.replace('for the headlamp, Crawler path presentation', 'for the headlamp, vent blower, Crawler path presentation', 1)
          design.write_text(text, encoding='utf-8')

          plan = Path('docs/repository-improvement-plan.md')
          text = plan.read_text(encoding='utf-8')
          section = '''## September 12 Level 1 VentRoom blower set piece\n\n**Confirmed design correction:** Greg does not want the Level 1 vent system redesigned. The existing `VentRoom` mesh already provides the desired variation by widening and increasing height for a short chamber before tapering back to the same tunnel. Treat that space as an equipment bay only; preserve the route, geometry, zone behavior and Crawler path.\n\n**Implemented on `feature/level1-vent-blower` / PR #17:** `VentBlowerSetPiece` registers when `Level1_Containment` loads, finds the existing `VentRoom`, and mounts one runtime set piece against the widened +Z wall. The prototype uses a chunky six-blade rotor, guard, housing, conduit and maintenance-light housing. The fan rotates visually at a fixed slow rate. A small red point light is shadowless with zero bounce, and a spatial 3D `AudioSource` plays a generated low motor/blade-thrum loop with a 6.5 m maximum distance so the widened chamber has a distinct mechanical sound without adding a shipped audio asset. The implementation has no Photon dependency.\n\n**Traversal/performance boundary:** all runtime primitive colliders are disabled before destruction, the blower does not carve or rebuild NavMesh, and it is positioned against the side wall rather than across the player/Crawler center route. Generated renderers do not cast/receive shadows or use light/reflection probes. This is source intent, not runtime proof.\n\n**Pending validation:** Unity 2022.3.55f1 import/compile; confirm the blower appears exactly once after Level 1 load/re-entry; inspect scale, side-wall placement and clearance in Play Mode/headset; verify no Gorilla hand/body snag and no Crawler path obstruction; tune fan speed, red-light range/intensity and motor volume/rolloff; verify the machinery masks nearby vent cues without making the Crawler impossible to read; test two-client Photon sessions; and measure target Quest frame time/audio behavior.\n\n'''
          marker = '## September 12 spawn-hand initialization follow-up'
          if section.strip() not in text:
              if marker not in text:
                  raise SystemExit('repository plan insertion marker not found')
              text = text.replace(marker, section + marker, 1)
          plan.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/oneoff-vent-blower-doc-sync.yml

          if git diff --quiet; then
            echo "No documentation changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-and-lore.md docs/repository-improvement-plan.md .github/workflows/oneoff-vent-blower-doc-sync.yml
          git commit -m "Document Level 1 vent blower decision"
          git push origin HEAD:feature/level1-vent-blower
