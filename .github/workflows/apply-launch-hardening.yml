name: Apply launch lifecycle hardening

on:
  push:
    branches:
      - feature/launch-presentation-polish
    paths:
      - 'Tools/_apply_launch_hardening.py'
      - '.github/workflows/apply-launch-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/launch-presentation-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded hardening patch
        run: python Tools/_apply_launch_hardening.py
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Hardening already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets ProjectSettings Tools docs
          git commit -m 'fix: harden launch reveal and Hub room spawning'
          git push origin HEAD:feature/launch-presentation-polish
