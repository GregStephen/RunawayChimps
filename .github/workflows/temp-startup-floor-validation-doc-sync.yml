name: Temporary startup floor validation documentation sync

on:
  push:
    branches:
      - fix/startup-floor-regression
    paths:
      - .github/workflows/temp-startup-floor-validation-doc-sync.yml

permissions:
  contents: write

jobs:
  sync-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/startup-floor-regression
          fetch-depth: 0

      - name: Record successful source validation
        shell: bash
        run: |
          set -euo pipefail
          design='**Validation update, 2026-09-14:** PR #24 Source Integrity passed after the post-release startup-floor hardening, including Unity-version verification, C# syntax, repository integrity, existing Level 1 contracts, the new startup-floor contracts, security/threat checks, merge-marker rejection, and human-authored whitespace checks. Runtime proof remains pending in Unity 2022.3.55f1/headset; this source result does not mark the floor regression resolved.'
          plan='**Validation update, 2026-09-14:** PR #24 Source Integrity is green with the new startup-floor safety validator plus the existing repository-wide source checks. Runtime acceptance remains pending: repeated cold Hub starts across varied headset/controller/recenter states, then travel/capture, two-client Photon, and Quest/headset checks.'
          if ! grep -Fq 'PR #24 Source Integrity passed after the post-release startup-floor hardening' docs/design-and-lore.md; then
            printf '\n\n%s\n' "$design" >> docs/design-and-lore.md
          fi
          if ! grep -Fq 'PR #24 Source Integrity is green with the new startup-floor safety validator' docs/repository-improvement-plan.md; then
            printf '\n\n%s\n' "$plan" >> docs/repository-improvement-plan.md
          fi

      - name: Commit validation record and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-startup-floor-validation-doc-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git commit -m 'Record startup floor source validation'
          git push origin HEAD:fix/startup-floor-regression
