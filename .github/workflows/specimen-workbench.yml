name: Specimen branch workbench
on:
  push:
    branches: [feature/reactive-specimen-jar]
    paths: [Tools/_publish_specimen.py]
permissions:
  contents: write
concurrency:
  group: specimen-branch-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install repository parser dependencies
        run: python -m pip install 'tree-sitter==0.25.2' 'tree-sitter-c-sharp==0.23.5'
      - name: Apply feature, validate and publish to its branch only
        run: python Tools/_publish_specimen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specimen-validation
          path: /tmp/specimen-validation.json
          if-no-files-found: ignore
          retention-days: 7
