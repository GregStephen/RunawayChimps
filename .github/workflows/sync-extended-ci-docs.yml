name: Sync extended CI docs

on:
  push:
    paths:
      - '.github/workflows/sync-extended-ci-docs.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-level1-crawler-lighting
      - run: python Tools/sync_extended_ci_docs.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Record extended source validation coverage'
            git push origin HEAD:codex/fix-level1-crawler-lighting
          fi
