name: Confirm Level 2 room sizing

on:
  push:
    branches:
      - design/level2-expanded-map-v04
    paths:
      - .github/workflows/confirm-level2-room-sizing.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/level2-expanded-map-v04
          fetch-depth: 0
      - name: Record confirmed room sizing and Listener navigation concern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          replace('docs/design-and-lore.md',
          'The exact v0.4 room proportions and obstacle placements remain proposed until the blockout is reviewed. `main` still contains v0.3. Source/box-route validation has passed on v0.4; Unity 2022.3.55f1, Photon and headset validation remain pending.',
          'Greg reviewed the v0.4 fuse-power blockout and confirmed the current room sizing/proportions. Obstacle placement, ceiling judgment, final Listener clearances and runtime navigation remain subject to validation/tuning. `main` still contains v0.3. Source/box-route validation has passed on v0.4; Unity 2022.3.55f1, Photon and headset validation remain pending.')

          marker='| 2026-09-11 | Replace Level 2\'s hammer/strike repair with four personal hand-held cylindrical power fuses distributed around the map.'
          p=Path('docs/design-and-lore.md'); s=p.read_text()
          idx=s.index(marker)
          line='| 2026-09-11 | Approve the current v0.4 room sizing/proportions shown in the fuse-power blockout. Keep Listener navigation as a separate implementation/validation concern: use a Listener-sized walkable area so narrow player-only pockets are excluded, and ensure patrol/chase targets stay on that area. | Confirmed room sizing. Listener NavMesh/agent setup, turning clearance and runtime stuck-case testing remain pending. |\n'
          s=s[:idx]+line+s[idx:]
          p.write_text(s)

          replace('docs/repository-improvement-plan.md',
          'The exact room bounds, obstacle placements, 5 m ceiling target and provisional repair-frame scaling remain **proposed for review**, not final confirmed design.',
          'Greg has now **confirmed the current v0.4 room sizing/proportions** shown by these bounds. Obstacle placements, the 5 m ceiling judgment, provisional repair-frame scaling and final Listener navigation clearances remain subject to Unity/runtime tuning.')
          replace('docs/repository-improvement-plan.md',
          '**Pending validation/implementation:** Unity 2022.3.55f1 import, actual gate/island clearance, Gorilla pickup/hold/drop behavior, drawer/cabinet interactions, personal fuse visibility/state, lever ergonomics, charge interruption/resume, Listener sound response, NavMesh around the island, two-client independence/cooperation, powered-exit feedback and Quest performance.',
          '**Pending validation/implementation:** Unity 2022.3.55f1 import, actual gate/island clearance, Gorilla pickup/hold/drop behavior, drawer/cabinet interactions, personal fuse visibility/state, lever ergonomics, charge interruption/resume, Listener sound response, and a dedicated Listener-sized navigation bake/agent footprint that excludes spaces too tight for the creature. Patrol and chase destinations must resolve onto that walkable area; test doorway approaches, corners, bypass offsets and full circulation around the power island for stuck cases. Two-client independence/cooperation, powered-exit feedback and Quest performance also remain pending.')

          p=Path('docs/level2-expanded-layout-v04.md'); s=p.read_text()
          s=s.replace('**Implemented for review:** branch `design/level2-expanded-map-v04` now builds the room arrangement below into the normal Level 2 Unity scene and reusable prefab. The exact arrangement/dimensions remain **proposed for final design approval** until the blockout is reviewed. `main` still contains v0.3.',
                      '**Confirmed room sizing / implemented blockout:** Greg reviewed the fuse-power v0.4 blockout and approved the current room sizing/proportions below. Branch `design/level2-expanded-map-v04` builds that arrangement into the normal Level 2 Unity scene and reusable prefab. Obstacle placement and runtime Listener navigation may still be tuned. `main` still contains v0.3.')
          s=s.replace('## Proposed 36 x 36 m planning grid','## Confirmed v0.4 room sizing')
          s=s.replace('| Space | Proposed bounds | Approx. size |','| Space | Confirmed blockout bounds | Approx. size |')
          s=s.replace('These are planning coordinates, not approved final wall transforms.','These room bounds/sizes are now the confirmed v0.4 design target. Individual obstacle transforms, doorway fitting and navigation clearances may still move during Unity/runtime validation without reopening the overall room-sizing decision.')
          s=s.replace('5. **Pending:** rebuild NavMesh and Listener runtime navigation after layout approval.',
                      '5. **Pending:** build a Listener-specific navigation setup using the final creature footprint/agent radius so player-sized tight pockets are excluded. Project patrol and chase destinations onto that walkable area and test corners, doorway approaches, bypass offsets and the complete power-island loop for stuck cases.')
          s=s.replace('The exact wall positions, obstacle positions, ceiling height, repair-door locations and detailed dressing remain proposed until the enlarged blockout is reviewed. The bottom-right reward-room rule and minimum 36 x 36 m footprint are confirmed.',
                      'The current room sizing/proportions are confirmed. Obstacle positions, ceiling height, exact repair-door fitting, detailed dressing and Listener navigation tuning remain open to runtime adjustment. The bottom-right reward-room rule and minimum 36 x 36 m footprint remain confirmed.')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit documentation confirmation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/confirm-level2-room-sizing.yml
          git add docs/design-and-lore.md docs/repository-improvement-plan.md docs/level2-expanded-layout-v04.md
          git commit -m "Confirm Level 2 v0.4 room sizing"
          git push origin HEAD:design/level2-expanded-map-v04
