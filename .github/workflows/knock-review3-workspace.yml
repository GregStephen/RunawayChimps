name: Knock-back vent iterative reviewed fixes
on:
  push:
    branches: [feature/knock-back-vent]
    paths: [.github/workflows/knock-review3-workspace.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply exact reviewed files and verify scope
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          def run(*args):
              return subprocess.check_output(args).decode()
          encoded = pathlib.Path('.github/knock-review3-payload.b64').read_bytes()
          assert hashlib.sha256(encoded).hexdigest() == '5031b4cb74d8da04a42f882c518d55de4140f6c0fb8171f40b089568bc3b81c0', 'Payload checksum mismatch'
          payload = json.loads(lzma.decompress(base64.b64decode(encoded)))
          expected = {'Assets/Scripts/KnockBackVent/KnockBackVent.cs', 'Assets/Scripts/KnockBackVent/Core/KnockBackVentModel.cs', 'Assets/Tests/KnockBackVent/VentModelChecks.cs', 'Tools/KnockBackVentAdapterHarness/Program.cs', 'Tools/validate_knock_back_vent.py', 'docs/design-and-lore.md', 'docs/repository-improvement-plan.md', 'docs/knock-back-vent.md'}
          assert set(payload['before']) == set(payload['after']) == expected
          relay = {'.github/workflows/knock-review3-workspace.yml', '.github/knock-review3-payload.b64'}
          assert set(run('git', 'diff', '--name-only', 'da21638fa0de872d0969116d2344e20a0698eeb2', 'HEAD').splitlines()) == relay, 'Concurrent unreviewed changes; abort rather than overwrite'
          for name, wanted in payload['before'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == wanted, 'Changed baseline: ' + name
          patch = pathlib.Path('/tmp/knock-review3.patch')
          patch.write_text(payload['patch'])
          run('git', 'apply', '--check', str(patch))
          run('git', 'apply', '--index', str(patch))
          assert set(run('git', 'diff', '--cached', '--name-only').splitlines()) == expected
          for name, wanted in payload['after'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == wanted, 'Changed output: ' + name
          pathlib.Path('/tmp/knock-review3-manifest.json').write_text(json.dumps(payload['after'], indent=2))
          print('PASS: exact eight reviewed file hashes; no unrelated code, scene, asset or settings changes.')
      - name: Install pinned source parsers
        run: python -m pip install --disable-pip-version-check 'tree-sitter==0.25.2' 'tree-sitter-c-sharp==0.23.5'
      - name: Execute managed diagnostics and all repository source checks
        shell: bash
        run: |
          set -euo pipefail
          {
            dotnet run --project Tools/CardSystemHarness/CardSystemHarness.csproj --configuration Release
            dotnet run --project Tools/KnockBackVentHarness/KnockBackVentHarness.csproj --configuration Release
            dotnet run --project Tools/KnockBackVentAdapterHarness/KnockBackVentAdapterHarness.csproj --configuration Release
            python -c "from pathlib import Path; import re; t=Path('ProjectSettings/ProjectVersion.txt').read_text(encoding='utf-8-sig'); assert re.findall(r'^m_EditorVersion:[ \t]*(\S+)[ \t]*$',t,re.M)==['2022.3.62f3']; assert re.findall(r'^m_EditorVersionWithRevision:[ \t]*(.+?)[ \t]*$',t,re.M)==['2022.3.62f3 (96770f904ca7)']; print('PASS: unchanged Unity 2022.3.62f3 baseline.')"
            python Tools/validate_source.py --syntax
            python Tools/validate_repository_integrity.py
            python Tools/validate_level1_contracts.py
            python Tools/validate_spawn_floor_contracts.py
            python Tools/validate_keycard_reader_contracts.py
            python Tools/validate_interaction_safety.py
            python Tools/validate_pr15_review_hardening.py
            python Tools/validate_security_boot.py
            python Tools/validate_threat_feedback.py
            python Tools/validate_launch_presentation.py
            python Tools/validate_knock_back_vent.py
            python -m compileall -q Tools
            if git grep -n -E '^(<<<<<<< .+|>>>>>>> .+|=======$)' -- .; then exit 1; fi
            git diff --cached --check da21638fa0de872d0969116d2344e20a0698eeb2 -- '*.cs' '*.py' '*.md' '*.json' '*.yml' '*.yaml' '*.sh' '*.txt' '*.asmdef' '*.asmref' '*.xml' '*.csproj' '*.props' '*.targets' '*.toml' '*.ini' '*.cfg' '*.config' '*.uxml' '*.uss' '.gitignore' '.gitattributes'
            echo 'PASS: all source and managed checks. Unity and headset tests were NOT executed.'
          } 2>&1 | tee /tmp/knock-review3-validation.log
      - name: Publish reviewed fixes without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'fix: use authored hand tracking frame and preserve exact tap intervals'
          git push origin HEAD:refs/heads/feature/knock-back-vent
          git rev-parse HEAD | tee /tmp/knock-review3-published-sha.txt
      - name: Preserve review validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: knock-back-vent-review3-evidence
          path: |
            /tmp/knock-review3-validation.log
            /tmp/knock-review3-manifest.json
            /tmp/knock-review3-published-sha.txt
          retention-days: 7
