name: Facility announcement checks
on:
  pull_request:
    paths:
      - 'Assets/Scripts/FacilityAnnouncements/**'
      - 'Assets/RunawayChimps/FacilityAnnouncements/**'
      - 'Tools/FacilityAnnouncements*/**'
      - '.github/workflows/facility-announcements-checks.yml'
  push:
    branches: ['feature/facility-announcements']
    paths:
      - 'Assets/Scripts/FacilityAnnouncements/**'
      - 'Assets/RunawayChimps/FacilityAnnouncements/**'
      - 'Tools/FacilityAnnouncements*/**'
      - '.github/workflows/facility-announcements-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  facility-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: dotnet run --project Tools/FacilityAnnouncementsHarness/FacilityAnnouncementsHarness.csproj --configuration Release
      - name: Exercise production adapters with instrumented managed doubles
        run: dotnet run --project Tools/FacilityAnnouncementsAdapterHarness/FacilityAnnouncementsAdapterHarness.csproj --configuration Release
      - run: python Tools/FacilityAnnouncements/validate_assets.py
