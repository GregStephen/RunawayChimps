name: Temporary keycard source validation trigger

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - '.github/workflows/temp-source-validation-trigger.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback
      - name: Remove helper and push a user-visible branch update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/temp-source-validation-trigger.yml
          git add .github/workflows/temp-source-validation-trigger.yml
          git commit -m 'Remove temporary validation trigger'
          git push origin HEAD:feature/keycard-reader-light-feedback
