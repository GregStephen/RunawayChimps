name: Prepare isolated Unity 62f3 trial once
on:
  push:
    branches: ['compat/unity-2022.3.62f3']
    paths: ['.github/workflows/prepare-unity62f3-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.deleted == false && !contains(github.event.head_commit.message, 'remove preparation helper')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Apply guarded non-workflow preparation
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          base = '9da4a1e46faa16484af9425edb41517a5a931a75'
          source = '685e4a7cacd216f3eac560923c0e7deee398968a'
          ci_commit = '0ca5e0a89e2e2a7d9f82d962777c73c29aefc0fe'
          helper = '.github/workflows/prepare-unity62f3-once.yml'
          workflow = '.github/workflows/source-validation.yml'
          assert git('rev-parse', 'HEAD^').strip() == ci_commit
          assert set(git('diff', '--name-only', base, 'HEAD').splitlines()) == {helper, workflow}
          approved_ci = Path(workflow).read_bytes()
          assert git('hash-object', workflow).strip() == 'cb9253bd92d77499d073384fb38ebc97967dbba1'
          original = git('show', source + ':' + helper)
          begin = original.index('        run: |\n') + len('        run: |\n')
          end = original.index('      - name: Commit to the isolated branch only', begin)
          code = textwrap.dedent(original[begin:end])
          def patch(old, new):
              global code
              assert code.count(old) == 1, old
              code = code.replace(old, new, 1)
          patch("assert git('rev-parse', 'HEAD^').strip() == BASE, 'Unexpected parent; re-review branch.'", "assert git('rev-parse', 'HEAD^').strip() == '0ca5e0a89e2e2a7d9f82d962777c73c29aefc0fe', 'Unexpected authorized CI parent.'")
          patch("assert git('diff', '--name-only', BASE, 'HEAD').splitlines() == [HELPER]", "assert set(git('diff', '--name-only', BASE, 'HEAD').splitlines()) == {HELPER, '.github/workflows/source-validation.yml'}")
          patch("guard = '''from pathlib import Path", "guard = r'''from pathlib import Path")
          # Replace only the first numbered step, not the complete contiguous eight-step plan.
          start = code.index('def paragraph(')
          finish = code.index('def insert_section(', start)
          replacement = '\n'.join([
              'def paragraph(path, prefix, new):',
              "    units = edits[path].splitlines() if prefix.startswith('1. ') else edits[path].split(chr(10) * 2)",
              '    matches = [p for p in units if p.startswith(prefix)]',
              '    assert len(matches) == 1, (path, prefix, len(matches))',
              '    replace(path, matches[0], new)',
              ''
          ])
          code = code[:start] + replacement + code[finish:]
          # Reproduce the reviewed edits from the baseline in this disposable checkout.
          # The connector has already published the workflow edit with its own authorization.
          Path(workflow).write_bytes(subprocess.check_output(['git', 'show', base + ':' + workflow]))
          compile(code, 'reviewed-unity62f3-preparation', 'exec')
          exec(compile(code, 'reviewed-unity62f3-preparation', 'exec'), {})
          assert Path(workflow).read_bytes() == approved_ci, 'Generated guard differs from the authorized workflow edit.'
          assert workflow not in git('diff', '--cached', '--name-only', 'HEAD').splitlines(), 'Runner must not publish workflow edits.'
          security = Path('docs/unity-runtime-security-review.md').read_text()
          for step in ['2. Keep the original working checkout', '3. Install 62f3 alongside', '4. Update both ProjectVersion', '5. Import in the selected editor', '6. Build an identifiable standalone Quest', '7. Have the available Quest 2 tester', '8. Record commit, editor revision']:
              assert step in security, 'Historical implementation step lost: ' + step
          print('PASS: numbered installation/build/rollback plan preserved; runner changes no workflow file.')
      - name: Commit to the isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='compat/unity-2022.3.62f3'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: prepare isolated Unity 2022.3.62f3 compatibility trial' -m 'Refs #27. Pin both editor declaration lines; record Greg go-ahead and pending Unity/Android/Quest acceptance. Preserve packages, gameplay, authored assets, XR settings and historical evidence. CI was updated separately through the authorized repository connection.'
          git push origin "HEAD:refs/heads/$BRANCH"
