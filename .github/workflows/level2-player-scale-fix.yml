name: Apply Level 2 player-scale interaction correction
on:
  push:
    paths:
      - '.github/workflows/level2-player-scale-fix.yml'
jobs:
  rescale:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/level2-player-scale-interactions
      - name: Scale Level 2 objective hardware to gorilla rig
        shell: python
        run: |
          from pathlib import Path
          p=Path('Tools/Level2Blockout/build_level2.py')
          s=p.read_text()
          replacements={
          "node('Power_Island_Core',repair,(28,1.2,27),(4.4,2.4,2.4),'Metal',True)":"node('Power_Island_Core',repair,(28,.475,27),(2.4,.95,1.30),'Metal',True)",
          "node('Power_Island_Top',repair,(28,2.43,27),(4.65,.08,2.65),'Concrete')":"node('Power_Island_Top',repair,(28,.985,27),(2.55,.07,1.42),'Concrete')",
          "node('Power_Island_Center_Band',repair,(28,1.25,25.77),(4.0,.22,.08),'Amber')":"node('Power_Island_Center_Band',repair,(28,.48,26.34),(2.15,.10,.05),'Amber')",
          "node('Power_Island_Center_Band_North',repair,(28,1.25,28.23),(4.0,.22,.08),'Amber')":"node('Power_Island_Center_Band_North',repair,(28,.48,27.66),(2.15,.10,.05),'Amber')",
          " (1,27.0,25.72,-1),(2,29.0,25.72,-1),(3,27.0,28.28,1),(4,29.0,28.28,1),":" (1,27.45,26.30,-1),(2,28.55,26.30,-1),(3,27.45,27.70,1),(4,28.55,27.70,1),",
          " node(f'Fuse_Socket_{i}_Plate',repair,(x,1.28,z),(.82,.62,.10),'Concrete')":" node(f'Fuse_Socket_{i}_Plate',repair,(x,.58,z),(.30,.24,.055),'Concrete')",
          " node(f'Fuse_Socket_{i}_Opening',repair,(x,1.28,z+side*.06),(.42,.38,.06),'Amber')":" node(f'Fuse_Socket_{i}_Opening',repair,(x,.58,z+side*.035),(.12,.15,.035),'Amber')",
          " node(f'Fuse_Socket_{i}_Charge_Indicator',repair,(x,1.72,z+side*.07),(.42,.10,.04),'LightStrip')":" node(f'Fuse_Socket_{i}_Charge_Indicator',repair,(x,.78,z+side*.04),(.16,.05,.025),'LightStrip')",
          " node(f'Fuse_Socket_{i}_Lever_Base',repair,(x+.62,1.18,z),(.18,.46,.18),'Metal')":" node(f'Fuse_Socket_{i}_Lever_Base',repair,(x+.30,.56,z),(.08,.20,.08),'Metal')",
          " node(f'Fuse_Socket_{i}_Lever_Handle',repair,(x+.62,1.55,z),(.10,.64,.10),'Amber')":" node(f'Fuse_Socket_{i}_Lever_Handle',repair,(x+.30,.70,z),(.05,.25,.05),'Amber')",
          " node(f'FuseSocket{i}Marker',markers,(x,1.28,z),kind='empty')":" node(f'FuseSocket{i}Marker',markers,(x,.58,z),kind='empty')",
          "node('Exit_Power_Cable_EastWest',details,(16,0.10,25.55),(24,.12,.22),'Amber')":"node('Exit_Power_Cable_EastWest',details,(16,.08,25.55),(24,.08,.12),'Amber')",
          "node('Exit_Power_Cable_To_Island',details,(28,0.10,26.28),(.22,.12,1.46),'Amber')":"node('Exit_Power_Cable_To_Island',details,(28,.08,25.95),(.12,.08,.80),'Amber')",
          "for x in [8,13,18,23]: node('Exit_Power_Cable_Status_Node',details,(x,.18,25.55),(.42,.08,.34),'LightStrip')":"for x in [8,13,18,23]: node('Exit_Power_Cable_Status_Node',details,(x,.13,25.55),(.22,.05,.18),'LightStrip')",
          "node('PowerIslandCenter',markers,(28,1.2,27),kind='empty')":"node('PowerIslandCenter',markers,(28,.475,27),kind='empty')",
          "node('FuseChargeNoiseOrigin',markers,(28,1.2,27),kind='empty')":"node('FuseChargeNoiseOrigin',markers,(28,.60,27),kind='empty')",
          " node(f'Fuse_Cache_{i}_{label}_Body',fuse_search,(x,1.0,z),(1.5,2.0,.70),'Metal',True)":" node(f'Fuse_Cache_{i}_{label}_Body',fuse_search,(x,.40,z),(.75,.80,.45),'Metal',True)",
          " node(f'Fuse_Cache_{i}_{label}_DoorOrDrawer',fuse_search,(x,1.0,z-.39),(1.28,.62,.10),'Concrete')":" node(f'Fuse_Cache_{i}_{label}_DoorOrDrawer',fuse_search,(x,.42,z-.255),(.62,.28,.07),'Concrete')",
          " node(f'Fuse_Cache_{i}_Electrical_Label',fuse_search,(x,1.58,z-.45),(.62,.22,.04),'Amber')":" node(f'Fuse_Cache_{i}_Electrical_Label',fuse_search,(x,.70,z-.295),(.28,.10,.02),'Amber')",
          " node(f'Fuse_{i}_Personal_Cylindrical_Placeholder',fuse_search,(x,.78,z-.52),(.18,.36,.18),'Amber',kind='cylinder')":" node(f'Fuse_{i}_Personal_Cylindrical_Placeholder',fuse_search,(x,.52,z-.30),(.06,.10,.06),'Amber',kind='cylinder')",
          " node(f'Fuse{i}Start',markers,(x,.78,z-.52),kind='empty')":" node(f'Fuse{i}Start',markers,(x,.52,z-.30),kind='empty')",
          }
          for old,new in replacements.items():
              assert old in s, old
              s=s.replace(old,new)
          p.write_text(s)
      - name: Regenerate Level 2 assets
        run: |
          python Tools/Level2Blockout/build_level2.py
          python Tools/Level2Blockout/validate_level2.py
      - name: Verify player-scale geometry and runtime constants
        shell: python
        run: |
          from pathlib import Path
          import json
          layout=json.loads(Path('Tools/Level2Blockout/layout.json').read_text())
          nodes={n['name']:n for n in layout['nodes']}
          core=nodes['Power_Island_Core']
          assert core['position']==[28,0.475,27]
          assert core['scale']==[2.4,0.95,1.3]
          for i in range(1,5):
              socket=nodes[f'FuseSocket{i}Marker']; assert abs(socket['position'][1]-.58)<1e-6
              lever=nodes[f'Fuse_Socket_{i}_Lever_Handle']; assert abs(lever['position'][1]-.70)<1e-6
              fuse=nodes[f'Fuse_{i}_Personal_Cylindrical_Placeholder']; assert fuse['scale']==[.06,.10,.06]
          src=Path('Assets/Scripts/Level2/Level2FuseRuntimeBootstrap.cs').read_text()
          for token in ['FuseLength = .20f','FuseCoreDiameter = .052f','FuseEndCapDiameter = .068f','new Vector3(.26f, .28f, .22f)','new Vector3(.16f, .30f, .16f)','rb.mass = .25f']:
              assert token in src, token
          drawer=Path('Assets/Scripts/Level2/Level2NoisySearchContainer.cs').read_text()
          assert 'new Vector3(0, 0, -.18f)' in drawer
          print('Player-scale Level 2 objective checks passed.')
      - name: Update maintained design documentation
        shell: python
        run: |
          from pathlib import Path
          design=Path('docs/design-and-lore.md'); s=design.read_text()
          s=s.replace('`main` still contains v0.3. Source/box-route validation has passed on v0.4;', '`main` now contains the merged v0.4 blockout through PR #7. Source/box-route validation has passed on v0.4;')
          needle='| 2026-09-11 | Harden the Level 2 fuse prototype before Listener implementation:'
          row='| 2026-09-12 | Correct Level 2 objective interaction scale without shrinking the approved rooms. Greg runtime-tested the merged blockout and found the fuses, central power island, sockets and charging handles far too large/high for the gorilla character. Size interactive hardware from the active local rig/hand scale rather than the Listener/room scale. | Confirmed correction. Implemented on `fix/level2-player-scale-interactions`: ~20 cm hand-held fuse, ~0.58 m socket height, ~0.70 m lever height, ~0.95 m island height, smaller search containers/drawer travel. Unity 2022.3.55f1 headset/Play Mode ergonomic validation pending. |\n'
          if row not in s: s=s.replace(needle,row+needle)
          design.write_text(s)

          plan=Path('docs/repository-improvement-plan.md'); p=plan.read_text()
          p=p.replace('**Current implementation evidence:** `main` still contains the 18 × 18 m v0.3 map, but branch `design/level2-expanded-map-v04` now regenerates', '**Current implementation evidence:** PR #7 merged the 36 × 36 m v0.4 blockout and fuse prototype into `main`. The retained generator regenerates')
          marker='## September 11 Level 2 size correction and v0.4 design\n'
          section='''## September 12 Level 2 player-scale interaction correction\n\n**Confirmed runtime correction:** keep the approved 36 × 36 m room layout, but scale the fuse objective hardware to the gorilla player instead of to the oversized environment/Listener. Greg tested the merged Level 2 in Unity and reported that the fuses, socket locations and charging handles were dramatically oversized and physically unreachable. Repository inspection of the active Bootstrap rig shows ~10 cm hand-contact spheres, a ~0.36 m-wide / 1.16 m-high body capsule, and a 1.5 m max arm length.\n\n**Implemented on `fix/level2-player-scale-interactions`:** the central power island is reduced from 4.4 × 2.4 × 2.4 m to approximately 2.4 × 0.95 × 1.3 m while staying centered in the Repair Lab. Socket centers move from 1.28 m to ~0.58 m, charge handles from 1.55 m to ~0.70 m, the physical fuse prototype from ~42 cm long / 13–15 cm diameter to ~20 cm long / 5–7 cm diameter, and socket/lever interaction triggers are resized for the ~10 cm hand proxy. Fuse search cabinets and drawer travel are also reduced to player-scale. Room bounds, Repair Lab size, two escape routes, Listener clearance targets and the four-fuse objective are unchanged.\n\n**Validation status:** generated-source/box-route validation and explicit player-scale geometry checks pass on the branch. Unity 2022.3.55f1 Play Mode/headset validation is still required for comfortable reach, grab orientation, insertion, lever hold and drawer interaction.\n\n'''
          if section not in p: p=p.replace(marker,section+marker)
          plan.write_text(p)

          layoutdoc=Path('docs/level2-expanded-layout-v04.md')
          if layoutdoc.exists():
              q=layoutdoc.read_text()
              marker2='## Confirmed four-fuse power objective\n'
              note='''## Player-scale objective correction — confirmed September 12\n\nThe approved room bounds remain unchanged. Runtime testing showed the initial power island, fuses, sockets and levers were scaled for the large environment rather than the gorilla player. Interactive hardware must use the active rig as the scale reference: roughly 10 cm hand-contact diameter, 0.36 m body width, 1.16 m body-capsule height and 1.5 m max arm length. The corrected prototype targets a ~20 cm fuse, ~0.58 m socket center, ~0.70 m lever center and ~0.95 m island height. These values are implemented for the next Unity ergonomic test and may receive small reach/comfort tuning without reopening the confirmed room sizes.\n\n'''
              if note not in q: q=q.replace(marker2,note+marker2)
              layoutdoc.write_text(q)
      - name: Commit regenerated scale correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tools/Level2Blockout/build_level2.py Tools/Level2Blockout/layout.json Tools/Level2Blockout/validation.json Tools/Level2Blockout/gate_manifest.json Assets/RunawayChimps/Level2Blockout/Prefabs/Level2_Blockout.prefab Assets/RunawayChimps/Level2Blockout/Scenes/Level2_BehavioralConditioning_Blockout.unity docs/design-and-lore.md docs/repository-improvement-plan.md docs/level2-expanded-layout-v04.md
          git diff --cached --check
          git commit -m 'Scale Level 2 fuse objective to gorilla player'
          git push origin HEAD:fix/level2-player-scale-interactions
