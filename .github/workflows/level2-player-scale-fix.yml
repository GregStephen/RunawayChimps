name: Finalize Level 2 player-scale validation
on:
  push:
    paths:
      - '.github/workflows/level2-player-scale-fix.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/level2-player-scale-interactions
      - name: Run persistent Level 2 validator
        run: |
          python Tools/Level2Blockout/validate_level2.py
          python -m py_compile Tools/Level2Blockout/build_level2.py Tools/Level2Blockout/validate_level2.py
      - name: Verify generated ergonomic report
        shell: python
        run: |
          import json
          from pathlib import Path
          d=json.loads(Path('Tools/Level2Blockout/validation.json').read_text())
          assert d['player_scale_reference']['hand_contact_diameter_m']==.10
          assert d['objective_ergonomics']['power_island_size_m']==[2.4,.95,1.3]
          assert d['objective_ergonomics']['socket_center_height_m']==.58
          assert d['objective_ergonomics']['lever_center_height_m']==.70
          assert d['human_proxy']['either_repair_route_can_be_blocked']
          assert d['listener_proxy']['either_repair_route_can_be_blocked']
          print(json.dumps(d['objective_ergonomics'],indent=2))
      - name: Commit report and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tools/Level2Blockout/validation.json
          git rm .github/workflows/level2-player-scale-fix.yml
          git diff --cached --check
          git commit -m 'Finalize Level 2 player-scale validation'
          git push origin HEAD:fix/level2-player-scale-interactions
