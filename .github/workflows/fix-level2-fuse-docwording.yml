name: Correct stale Level 2 fuse wording
on:
  push:
    branches: [design/level2-expanded-map-v04]
    paths: [.github/workflows/fix-level2-fuse-docwording.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/level2-expanded-map-v04
      - name: Correct maintained plan wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/repository-improvement-plan.md')
          s=p.read_text()
          s=s.replace('Preserve the noisy-repair objective, two distinct repair escape routes, safe entry and qualified safe exit, the bottom-right reward-room relationship, the established gate language, and the RETURN TO SECURITY control.', 'Preserve the confirmed four-fuse power-restoration objective, two distinct Repair Lab escape routes, safe entry and qualified safe exit, the bottom-right reward-room relationship, the established gate language, and the RETURN TO SECURITY control.', 1)
          s=s.replace('Listener/repair gameplay, cross-level reward-card lifecycle', 'Listener/fuse-power gameplay, cross-level reward-card lifecycle', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-level2-fuse-docwording.yml
          git add docs/repository-improvement-plan.md
          git commit -m "Align Level 2 plan with confirmed fuse objective"
          git push origin HEAD:design/level2-expanded-map-v04
