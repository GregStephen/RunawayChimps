name: Level 2 fuse hardening validation
on:
  push:
    paths:
      - '.github/workflows/level2-fuse-hardening-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/level2-expanded-map-v04
      - name: Validate fuse hardening source
        shell: python
        run: |
          from pathlib import Path
          d=Path('Assets/Scripts/Level2')
          required=['Level2Fuse.cs','Level2FuseSocket.cs','Level2ChargeLever.cs','Level2NoiseBus.cs','Level2NoiseDebug.cs','Level2NoisySearchContainer.cs','Level2SearchContainerHandle.cs','Level2PowerState.cs','Level2FuseObjective.cs','Level2FuseRuntimeBootstrap.cs']
          for f in required:
              p=d/f; assert p.exists(),f; assert Path(str(p)+'.meta').exists(),f+'.meta'
              s=p.read_text(); assert s.count('{')==s.count('}'),f
          text='\n'.join((d/f).read_text() for f in required)
          for token in ['Level2FuseState','Level2SocketState','ResetToSpawn','Level2NoiseDebug','LastEvent','HashSet<Collider>','Level2SearchContainerHandle','Level2PowerState','PROTOTYPE-ONLY','indicator =']:
              assert token in text,token
          layout=Path('Tools/Level2Blockout/layout.json').read_text()
          for i in range(1,5):
              assert f'Fuse{i}Start' in layout and f'FuseSocket{i}Marker' in layout
          print('Level 2 fuse hardening source checks passed.')
      - name: Update maintained docs
        shell: python
        run: |
          from pathlib import Path
          design=Path('docs/design-and-lore.md'); s=design.read_text()
          needle='| 2026-09-11 | Implement the approved Level 2 fuse interaction foundation:'
          row='| 2026-09-11 | Harden the Level 2 fuse prototype before Listener implementation: explicit fuse/socket state machines, multi-collider-safe lever holding, loose-fuse fall recovery, power-island indicator feedback, noise debug logging/gizmos, a reusable power-state endpoint, and a first physical noisy drawer interaction. Keep the runtime bootstrap prototype-only until authored prefabs replace it. | Implemented on `design/level2-expanded-map-v04`; source/marker hardening checks pass. Unity 2022.3.55f1/XR behavior, capture-drop positioning, personal Photon presentation, final drawer ergonomics, powered exit and Listener consumption remain pending. |\n'
          if row not in s: s=s.replace(needle,row+needle); design.write_text(s)
          plan=Path('docs/repository-improvement-plan.md'); p=plan.read_text()
          marker='**Pending validation/implementation:** Unity 2022.3.55f1 import/compile'
          note='**Fuse hardening implemented on the review branch:** the prototype now uses explicit `Level2FuseState` and `Level2SocketState` transitions; prevents duplicate socket insertion/completion; handles multiple local hand colliders on a lever without false release; recovers loose fuses that fall below the level; drives socket indicators for empty/inserted/charging/charged state; records timestamped noise events with optional Scene-view gizmo/log diagnostics; exposes `Level2PowerState` as the clean downstream power endpoint; and makes the generated search drawer respond to a local-hand trigger with constrained movement plus search noise. `Level2FuseRuntimeBootstrap` is explicitly prototype-only and should be replaced by authored prefabs after Unity/XR scale validation. Source/marker checks pass; this is not Unity runtime validation.\n\n'
          if note not in p: p=p.replace(marker,note+marker); plan.write_text(p)
      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'Document Level 2 fuse hardening'; git push origin HEAD:design/level2-expanded-map-v04; fi
