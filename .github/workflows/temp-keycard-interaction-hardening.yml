name: Temporary keycard interaction hardening sync

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - .github/workflows/temp-keycard-interaction-hardening.yml

permissions:
  contents: write

jobs:
  sync-authored-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback
          fetch-depth: 0

      - name: Harden Level 1 cards, panel prefab, and maintained docs
        shell: python
        run: |
          from pathlib import Path
          import re

          scene_path = Path('Assets/Scenes/Level1_Containment.unity')
          scene = scene_path.read_text(encoding='utf-8')
          keycard_guid = '4e535a396467fea4587e1f53f2d211ec'
          for file_id in ('768804180', '2117548410'):
              block_pattern = re.compile(
                  rf'(--- !u!114 &{file_id}\n.*?m_Script: \{{fileID: 11500000, guid: {keycard_guid}, type: 3\}}.*?m_EditorClassIdentifier: *\n)(?!  credential:)',
                  re.DOTALL,
              )
              scene, count = block_pattern.subn(r'\1  credential: 1\n', scene, count=1)
              if count != 1:
                  block_start = scene.find(f'--- !u!114 &{file_id}\n')
                  block_end = scene.find('\n--- !u!', block_start + 1) if block_start >= 0 else -1
                  block = scene[block_start:block_end if block_end >= 0 else None]
                  if 'credential: 1' not in block:
                      raise SystemExit(f'Could not serialize AmberTriangle credential on KeyCard component {file_id}')
          scene_path.write_text(scene.rstrip() + '\n', encoding='utf-8')

          panel_path = Path('Assets/RunawayChimps/Environment/KeycardReaders/Prefabs/Door_Keycard_Lock_Indicator.prefab')
          panel = panel_path.read_text(encoding='utf-8')
          legacy_flag = '  autoBindUniqueKeyBoxInScene: 1\n'
          if legacy_flag not in panel:
              raise SystemExit('Expected legacy lock-panel auto-binding flag was not found')
          panel_path.write_text(panel.replace(legacy_flag, '', 1).rstrip() + '\n', encoding='utf-8')

          design_addition = '''

## September 14 explicit keycard credential and in-zone retry hardening

**Confirmed correction:** physical gameplay cards now own an explicit shared `KeycardCredential` identity, just like the reader variants. The two active Level 1 cards serialize `AmberTriangle` directly. Reader/card object names and imported child-art names are now compatibility fallback only; an explicit gameplay-card credential is authoritative and cannot be changed by renaming the object or adding unrelated child visuals. This supersedes the earlier temporary wording that relied on card-name parsing until a dedicated card credential existed.

**Interaction correction:** a matching card that is already inside the reader scan zone remains eligible for submission retries while it stays physically overlapped. If its first attempt fails because it has not yet been held by the local player or the existing `KeyBox` guards are temporarily unavailable, becoming eligible no longer requires pulling the card out and re-entering the reader. Duplicate acceptance is still prevented by the existing `KeyCard`/`KeyBox` lifecycle.

**Lock-panel binding correction:** `KeycardLockProgressIndicator` no longer performs scene-wide unique-`KeyBox` discovery. Live progress requires an explicit `KeyBox` binding, runtime `Bind`, or an authored parent `KeyBox`; the standalone prefab still previews two lamps when unbound. The current reusable panel remains a 1-4-card asset because it authors four lamp renderers; locks requiring more than four indicators need an expanded panel rather than silent truncation.

**Implemented on `feature/keycard-reader-light-feedback`:** shared `KeycardCredential` values are used by `KeyCard` and `KeycardReaderLightController`; both active Level 1 Amber cards serialize credential value 1; reader overlap tracking keeps pending matching gameplay cards and retries their normal `TryInsertInto` path while overlap remains; the progress panel's old scene-wide auto-bind flag/path is removed. `SectorTravelValidator` now checks active Level 1 card credentials, XR grab, solid colliders, Rigidbodies, active reader triggers and explicit reader identities. `Tools/validate_keycard_reader_contracts.py` now protects those contracts plus the progress-panel prefab wiring and no-global-binding rule.

**Pending validation:** rerun PR #23 Source Integrity after this hardening, then validate in Unity 2022.3.55f1. Runtime checks remain: hold a matching Amber card before entry and after it is already resting inside the scan zone, verify both paths count exactly once; confirm wrong cards never count; prove 0/2 -> 1/2 -> 2/2 persistence and travel; verify the explicitly bound lock panel in its final Level 1 placement; then repeat two-client Photon and Quest/headset checks.
'''

          plan_addition = '''

## September 14 keycard identity/retry review follow-up

**Confirmed architecture correction:** `KeyCard` and readers now share the same explicit `KeycardCredential` enum (`Auto`, Amber Triangle, Cyan Three Bars, Red Circle, Violet Diamond). Explicit card identity wins over any GameObject/FBX name. Name parsing remains only legacy compatibility. The current two scene-authored Level 1 cards are explicitly Amber Triangle.

**Implemented interaction hardening:** matching-card overlap is tracked independently from one-time trigger entry. A valid gameplay card that remains inside the reader can retry the existing guarded `TryInsertInto(KeyBox)` path until it succeeds or leaves the scan zone, fixing the prior green-reader/no-progress edge case when local-hold or another guard became valid after `OnTriggerEnter`. Successful cards still consume once and duplicate `KeyBox` acceptance remains blocked.

**Implemented binding/validation hardening:** the progress indicator no longer searches the scene for a unique `KeyBox`; it uses explicit/runtime binding or an authored parent only. The prefab is intentionally a four-slot maximum asset and previews two slots for Level 1. `SectorTravelValidator` now validates active keycard credential, XR-grab, Collider/Rigidbody and reader-trigger setup. `Tools/validate_keycard_reader_contracts.py` additionally protects explicit Level 1 card serialization, in-zone retry source wiring, progress-panel materials/lamps, reader identities, and both reader/panel no-global-binding rules.

**Pending validation:** PR #23 Source Integrity must pass again on the hardened head. Unity 2022.3.55f1 import/compile and Play Mode still need to prove held-before-entry and held-after-entry scans, wrong-card rejection, single consumption, persistent 0/2 -> 1/2 -> 2/2 progress, Level 1 travel, explicit panel binding/placement, two-client personal independence, and Quest/headset presentation.
'''

          updates = {
              Path('docs/design-and-lore.md'): design_addition,
              Path('docs/repository-improvement-plan.md'): plan_addition,
          }
          for path, addition in updates.items():
              text = path.read_text(encoding='utf-8')
              heading = addition.strip().splitlines()[0]
              if heading not in text:
                  text = text.rstrip() + addition
              path.write_text(text.rstrip() + '\n', encoding='utf-8')

      - name: Commit synced authoring and remove temporary workflow
        run: |
          git rm .github/workflows/temp-keycard-interaction-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scenes/Level1_Containment.unity \
            Assets/RunawayChimps/Environment/KeycardReaders/Prefabs/Door_Keycard_Lock_Indicator.prefab \
            docs/design-and-lore.md docs/repository-improvement-plan.md
          git commit -m "Harden keycard credential and lock wiring"
          git push origin HEAD:feature/keycard-reader-light-feedback
