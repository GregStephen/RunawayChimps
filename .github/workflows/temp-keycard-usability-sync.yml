name: Temporary keycard usability sync

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - '.github/workflows/temp-keycard-usability-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback
          fetch-depth: 0

      - name: Apply keycard pickup and reader reachability hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one occurrence in {path}, found {text.count(old)}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # The original scan trigger was almost flush with the reader face. At the current
          # Level 1 2x reader scale it covered only about 6-18 cm in front of the root. Give
          # the player a forgiving forward scan envelope without adding any solid collision.
          replace_once(
              'Assets/RunawayChimps/Environment/KeycardReaders/Prefabs/Reader_Base.prefab',
              '  m_LocalPosition: {x: 0, y: 0.155, z: 0.06}',
              '  m_LocalPosition: {x: 0, y: 0.155, z: 0.095}')
          replace_once(
              'Assets/RunawayChimps/Environment/KeycardReaders/Prefabs/Reader_Base.prefab',
              '  m_Size: {x: 0.14, y: 0.12, z: 0.06}\n  m_Center: {x: 0, y: 0, z: 0}',
              '  m_Size: {x: 0.18, y: 0.16, z: 0.13}\n  m_Center: {x: 0, y: 0, z: 0}')

          validator = Path('Tools/validate_keycard_reader_contracts.py')
          text = validator.read_text(encoding='utf-8-sig')

          marker = '''    require(\n        "RigidbodyInterpolation.Interpolate" in keycard\n        and "CollisionDetectionMode.ContinuousDynamic" in keycard,\n        "Gameplay keycards must retain interpolated continuous Rigidbody handling for the thin moving prop.",\n    )\n'''
          addition = marker + '''    require(\n        'GrabAffordanceObjectName = "Keycard_GrabAffordance"' in keycard\n        and "grabPaddingMeters = 0.035f" in keycard\n        and "minimumGrabThicknessMeters = 0.06f" in keycard\n        and "grabAffordanceCollider.isTrigger = true;" in keycard\n        and "grab.colliders.Clear();" in keycard\n        and "grab.colliders.Add(grabAffordanceCollider);" in keycard,\n        "Gameplay keycards must keep a generous trigger-only XR grab affordance separate from their tight solid physics collider.",\n    )\n'''
          if marker not in text:
              raise SystemExit('Could not locate keycard Rigidbody validator marker.')
          text = text.replace(marker, addition, 1)

          marker = '''    require(\n        "gameplayCard.TryInsertInto(keyBox)" in controller,\n        "Matching readers must submit through the shared KeyCard acceptance lifecycle.",\n    )\n'''
          addition = marker + '''    require(\n        controller.count("other == null || other.isTrigger") >= 2,\n        "Reader enter/exit handling must ignore trigger-only grab affordances and scan only the physical card collider.",\n    )\n'''
          if marker not in text:
              raise SystemExit('Could not locate reader submission validator marker.')
          text = text.replace(marker, addition, 1)

          marker = '''    require("m_Name: ScanTarget_FRONT" in base, "Reader_Base must keep its authored scan target.")\n    require("m_IsTrigger: 1" in base, "Reader_Base scan target must remain a trigger.")\n'''
          addition = marker + '''    require(\n        "m_LocalPosition: {x: 0, y: 0.155, z: 0.095}" in base\n        and "m_Size: {x: 0.18, y: 0.16, z: 0.13}" in base,\n        "Reader_Base must keep the enlarged forward scan envelope proven necessary by runtime reachability feedback.",\n    )\n'''
          if marker not in text:
              raise SystemExit('Could not locate Reader_Base validator marker.')
          text = text.replace(marker, addition, 1)

          marker = '    print("PASS: gameplay cards auto-fit their colliders to rendered bounds and use lightweight continuous Rigidbody handling.")\n'
          addition = marker + '    print("PASS: dropped cards retain a trigger-only XR grab affordance and readers ignore that proxy for scanning.")\n    print("PASS: reader scan geometry keeps the enlarged forward reach envelope.")\n'
          if marker not in text:
              raise SystemExit('Could not locate keycard validator output marker.')
          text = text.replace(marker, addition, 1)
          validator.write_text(text, encoding='utf-8')

          design = Path('docs/design-and-lore.md')
          plan = Path('docs/repository-improvement-plan.md')
          marker = '## September 14 keycard pickup and reader-reachability runtime follow-up'

          design_section = r'''

## September 14 keycard pickup and reader-reachability runtime follow-up

**Validated partial runtime behavior:** Greg's next Unity test confirms one important slice of the reader flow now works in Play Mode: presenting a correct Amber card changed the reader LED green and advanced the separate persistent lock display from 0/2 to 1/2. This validates that one matching-card submission reached the objective and its progress indicator; it does not validate the full two-card/travel flow.

**Confirmed runtime failures:** the same test found two usability problems. A dropped thin card became extremely difficult to pick up again and could remain effectively ungrabbable for minutes. Separately, the player encountered what felt like a large invisible barrier around the reader/door area and had to fight the physical approach to get the card close enough for the scan to register.

**Source finding:** the reader prefab itself has no solid blocking collider; `ScanTarget_FRONT` is trigger-only, and the nested Level 1 completion `KeyBox` collider is trigger-only as well. The nearby authored LabWall and gate geometry remains intentionally solid. The reader's old scan trigger was simply too shallow for that physical environment: on the Level 1 reader's 2x scene scale it covered roughly 6-18 cm forward from the reader root, beginning essentially at the visible reader face. The prior physics correction also intentionally made the card's solid collider very thin, which is correct for world collision but leaves a dropped flat badge with an unnecessarily unforgiving XR hover/grab target if that same collider is used for acquisition.

**Implemented on `feature/keycard-reader-light-feedback`:** each gameplay `KeyCard` now creates a separate child `Keycard_GrabAffordance` BoxCollider used only by `XRGrabInteractable`. It is a trigger, adds 3.5 cm of world-space padding around the visible card and keeps at least 6 cm of acquisition thickness, while the tight solid card collider remains responsible for actual floor/wall physics. `KeycardReaderLightController` explicitly ignores trigger colliders so the larger pickup affordance cannot make a card scan early. `Reader_Base` expands `ScanTarget_FRONT` to local size 0.18 x 0.16 x 0.13 at local z 0.095; at Level 1's current 2x reader scale that is a forgiving roughly 36 x 32 cm face and a forward range of about 6-32 cm from the reader root, without adding any solid collision or changing the surrounding wall/gate colliders.

**Pending validation:** repeat pickup/drop/re-pickup cycles on both Amber cards, including cards lying flat and close to walls; re-grab should be immediate and consistent. Confirm the generous pickup trigger never blocks the world or causes an early reader acceptance. Approach the reader normally with the card and verify the enlarged scan zone removes the need to force the hand/card into nearby solid geometry. Then complete 1/2 -> 2/2, verify exactly-once consumption and travel, and recheck wrong-card rejection, fall recovery, two-client Photon independence and Quest/headset behavior. The apparent reader-area barrier is not considered resolved until the headset/Play Mode retest confirms normal approach; if a hard obstruction remains, inspect the exact wall/gate contact in-scene rather than disabling legitimate world collision globally.
'''

          plan_section = r'''

## September 14 keycard pickup and reader-reachability runtime follow-up

**Validated partial result / confirmed failures:** one correct Amber scan now produces the expected green reader acknowledgement and persistent 0/2 -> 1/2 progress in Unity. Runtime validation simultaneously exposed poor dropped-card reacquisition and an overly constrained physical approach to the reader. Record the successful 1/2 transition narrowly; do not promote the overall reader flow to validated.

**Source finding:** repository inspection rules out the reader and completion objective as the source of a giant solid collision volume: `Reader_Base` contains only its trigger scan collider and the nested Level 1 `KeyBox` uses a trigger. Nearby LabWall/gate collision is real world geometry and should not be globally disabled to make scanning easier. The interaction geometry was instead too unforgiving: the current 2x Level 1 reader converted the old local 0.06-deep scan box at z 0.06 into only about 6-18 cm of forward coverage, while the now-correct thin card physics collider also left a very small XR acquisition target after a flat drop.

**Implemented correction on `feature/keycard-reader-light-feedback`:** `KeyCard` now separates physical collision from interaction acquisition. The solid renderer-fitted BoxCollider stays thin; a runtime child trigger named `Keycard_GrabAffordance` provides 0.035 m world-space pickup padding and at least 0.06 m acquisition thickness, and `XRGrabInteractable` is explicitly pointed at that trigger. Reader enter/exit logic ignores trigger colliders, so this convenience volume cannot submit a card. `Reader_Base` now uses a larger forward trigger (`0.18 x 0.16 x 0.13`, center z `0.095`) so the current Level 1 2x instance can accept the real solid card roughly 6-32 cm in front of the reader instead of forcing the player's hand into the wall/door envelope. `Tools/validate_keycard_reader_contracts.py` protects the separate grab affordance, trigger filtering and enlarged scan geometry.

**Validation boundary:** source hardening is not the runtime result. In Unity 2022.3.55f1 verify immediate re-grab after repeated drops, especially flat-on-floor cases; no player shove; no world blocking from the grab affordance; no premature scan caused by the affordance; comfortable approach and scan without fighting an invisible obstruction; then 1/2 -> 2/2, consumption, travel, fall recovery, wrong-card behavior, two-client Photon and Quest/headset checks. If a physical obstruction is still present after the larger forward scan envelope, identify the exact authored wall/gate collider in Play Mode before changing collision geometry.
'''

          for path, section in ((design, design_section), (plan, plan_section)):
              text = path.read_text(encoding='utf-8-sig')
              if marker not in text:
                  path.write_text(text.rstrip() + section.rstrip() + '\n', encoding='utf-8')

      - name: Commit final usability hardening and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/temp-inspect-keycard-colliders.yml
          rm -f .github/workflows/temp-keycard-usability-sync.yml
          git add Assets/RunawayChimps/Environment/KeycardReaders/Prefabs/Reader_Base.prefab \
            Tools/validate_keycard_reader_contracts.py \
            docs/design-and-lore.md docs/repository-improvement-plan.md \
            .github/workflows/temp-inspect-keycard-colliders.yml \
            .github/workflows/temp-keycard-usability-sync.yml
          git commit -m 'Improve keycard pickup and reader reachability'
          git push origin HEAD:feature/keycard-reader-light-feedback
