name: One-time multiplayer docs sync

on:
  push:
    branches:
      - feature/global-threat-feedback
    paths:
      - 'Tools/_sync_multiplayer_testing_docs.py'
      - '.github/workflows/multiplayer-doc-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-threat-feedback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update maintained multiplayer testing docs
        run: python Tools/_sync_multiplayer_testing_docs.py
      - name: Commit maintained documentation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/design-and-lore.md docs/repository-improvement-plan.md; then
            echo 'Docs already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git commit -m 'docs: record local multiplayer testing workflow'
          git push origin HEAD:feature/global-threat-feedback
