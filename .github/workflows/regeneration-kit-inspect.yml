name: Regeneration serialization inspection
on:
  push:
    branches: [art/regeneration-lab-prop-kit]
    paths: [.github/workflows/regeneration-kit-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore checked authoring source
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json, lzma
          data = base64.b64decode(''.join(Path(f'.github/rgl-source.{i:02d}.b64').read_text() for i in range(5)), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'b18eb2b24302890e9cb451e59015dc0f8e977adb78f7c0b788a6a9aa266c743f'
          for name, text in json.loads(lzma.decompress(data)).items():
              assert name.startswith('Tools/RegenerationLab/') and '..' not in Path(name).parts
              assert not Path(name).exists()
              Path(name).parent.mkdir(parents=True, exist_ok=True)
              Path(name).write_text(text, encoding='utf-8')
      - run: python -m pip install 'numpy==2.3.5' 'Pillow==12.3.0'
      - name: Bake diagnostic copy only
        run: |
          python Tools/RegenerationLab/generate.py --output "$RUNNER_TEMP/rgl-diagnostic"
          python Tools/RegenerationLab/validate.py --root "$RUNNER_TEMP/rgl-diagnostic" --baseline . --report "$RUNNER_TEMP/rgl-diagnostic/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: regeneration-serialization-diagnostic
          path: ${{ runner.temp }}/rgl-diagnostic
          retention-days: 1
