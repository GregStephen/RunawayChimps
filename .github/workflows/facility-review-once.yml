name: Facility final review preparation (temporary)
on:
  push:
    branches: ['feature/facility-announcements']
    paths: ['.github/workflows/facility-review-once.yml']
permissions:
  contents: write
jobs:
  prepare-reviewed-source:
    if: github.ref == 'refs/heads/feature/facility-announcements'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply final reviewed corrections
        run: python Tools/FacilityAnnouncements/finalize_once.py
      - name: Execute production policy assertions
        run: dotnet run --project Tools/FacilityAnnouncementsHarness/FacilityAnnouncementsHarness.csproj --configuration Release
      - name: Validate corrected assets and network code reservation
        run: python Tools/FacilityAnnouncements/validate_assets.py
      - name: Commit reviewed feature changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Scripts/FacilityAnnouncements Tools/FacilityAnnouncements/build_assets.py Tools/FacilityAnnouncements/validate_assets.py Tools/FacilityAnnouncementsHarness/Program.cs
          git commit -m 'fix: test cue completion, prevent editor-load mutations and validate imported references'
          git push origin HEAD:refs/heads/feature/facility-announcements
