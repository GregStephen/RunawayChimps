name: One-time launch spawn correction docs sync

on:
  push:
    branches:
      - feature/launch-presentation-polish
    paths:
      - 'Tools/_sync_launch_spawn_correction.py'
      - '.github/workflows/launch-spawn-correction-doc-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/launch-presentation-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record launch and Hub-spawn correction
        run: python Tools/_sync_launch_spawn_correction.py
      - name: Commit maintained docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/design-and-lore.md docs/repository-improvement-plan.md docs/launch-presentation.md docs/launch-workstation-vignette.md; then
            echo 'Docs already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md docs/launch-presentation.md docs/launch-workstation-vignette.md
          git commit -m 'docs: record temporary launch vignette and Hub spawn slots'
          git push origin HEAD:feature/launch-presentation-polish
