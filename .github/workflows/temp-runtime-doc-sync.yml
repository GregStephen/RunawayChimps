name: Temporary runtime documentation sync

on:
  push:
    branches:
      - fix/runtime-keycard-crawler-loading

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record latest failed runtime tests and superseding fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          design_path = Path('docs/design-and-lore.md')
          plan_path = Path('docs/repository-improvement-plan.md')
          design = design_path.read_text(encoding='utf-8')
          plan = plan_path.read_text(encoding='utf-8')

          def sub_once(text, pattern, repl, label, flags=re.S | re.M):
              new, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return new

          # ---------------- design / lore ----------------
          hand_followup = r'''**September 12 spawn-hand runtime correction + integrated retest:** PR #14 fixed the original failure where a player could initialize with one or both Gorilla locomotion hands buried in the floor, and that reviewed source fix is merged on `main`. Greg's first integrated retest confirms a **partial improvement only**: the hands no longer begin buried, but the first-person visible fingertips can still pass through the floor and contact still feels wrong near that boundary. Source review found two separate presentation/contact mismatches. The active Bootstrap scene serializes `minimumRaycastDistance = 0.02` even though the authored Gorilla Rig hand proxy/default is 0.05 m, allowing the rendered hand to visibly penetrate farther before Gorilla locomotion detects contact. Separately, the local Photon avatar is intentionally visible (`HideLocalPlayer = 0`) and its visual hand targets were copying raw XR controller positions, bypassing the collision-safe `leftHandFollower` / `rightHandFollower` positions. PR #15 now clamps the runtime Gorilla hand-contact radius to at least 0.05 m and drives the visible/network avatar hand **position** from the collision-safe follower while preserving raw tracked controller **rotation**. This is source-implemented and Source Integrity passes, but the screenshot is a failed runtime result; fingertip/palm floor contact, locomotion push, travel/respawn and two-client presentation all require a new headset test before the hand issue is considered resolved.'''

          if '**September 12 spawn-hand runtime correction + integrated retest:**' not in design:
              marker = '**September 12 Level 1 vent headlamp + equipment-system follow-up:**'
              if marker not in design:
                  raise SystemExit('design: headlamp insertion marker missing')
              design = design.replace(marker, hand_followup + '\n\n' + marker, 1)

          latest_runtime = r'''**September 12 keycard/Crawler/loading runtime correction + integrated retest:** Greg's earlier runtime feedback confirmed three failures: Level 1 cards could fall through the floor indefinitely, Zombie Crawl could become visibly squished/compressed, and Loading could leave peripheral XR bleed. PR #15 still source-implements the spawn-relative card recovery and 12% Loading overscan; those two fixes remain pending headset confirmation. The first integrated Crawler retest **failed again**: the Zombie body is still severely folded/crushed. Greg's screenshot also shows the legacy `shoulderL` armature still present in the Level 1 hierarchy. Source inspection confirms that old armature exists, but it is not the skeleton the Zombie crawl clip targets: the Zombie FBX is a separate Generic rig and `mixamo.com.anim` binds to `mixamorig:Hips/.../mixamorig:LeftShoulder/...`, not the old `shoulderL` naming. The failed rotation-only correction was still independently overwriting world rotations on multiple parent/child torso bones after Animator evaluation, which can fold the hierarchy even without changing bone lengths. That approach is now superseded. `CrawlerBodyPathFollower` no longer writes **any** Zombie bone position or rotation and no longer performs hand-bone containment. The authored Zombie Animator owns the complete skeleton; code only aligns/grounds the whole visual hierarchy rigidly to the authoritative gameplay/NavMesh root. Experimental long-body corner bending is therefore deliberately disabled and returns to **pending design/implementation** until a rig-safe IK/Animation Rigging solution is proven. Source Integrity passes this baseline, but Unity/headset must now first prove an uncrushed authored crawl before corner deformation work resumes.'''

          design = sub_once(
              design,
              r'\*\*September 12 keycard/Crawler/loading runtime correction:\*\*.*?(?=\n\n## Decision and correction record)',
              latest_runtime,
              'design latest runtime paragraph')

          # Decision records: add visual-hand rule and supersede rotation-only Crawler rule.
          if 'The first-person/local avatar hand mesh must use the same collision-safe contact position' not in design:
              design = design.replace(
                  '| 2026-09-12 | A Level 1 objective keycard that falls through the floor',
                  '| 2026-09-12 | The first-person/local avatar hand mesh must use the same collision-safe contact position as Gorilla locomotion rather than raw XR controller position; normal floor contact must not show fingertips buried through the surface. | Confirmed from Greg\'s integrated runtime screenshot. PR #15 source-implements a 0.05 m minimum Gorilla hand-contact radius plus collision-safe follower positions for the visible/network avatar while retaining tracked rotation. Source Integrity passes; headset floor-contact/travel/two-client validation pending. |\n| 2026-09-12 | A Level 1 objective keycard that falls through the floor',
                  1)

          design = sub_once(
              design,
              r'^\| 2026-09-12 \| The Crawler\'s path-following presentation must preserve.*$',
              '| 2026-09-12 | The Crawler must preserve Zombie Crawl\'s authored Animator skeleton. The failed world-position **and** rotation-only torso-warp approaches are superseded; do not write post-Animator core-bone transforms until a rig-safe deformation system is separately implemented and headset-validated. | Confirmed after Greg\'s second crushed-body runtime screenshot. PR #15 now uses an Animator-owned skeleton with rigid whole-visual alignment only; corner-body bending is intentionally disabled/pending. Source Integrity passes; Unity/headset authored-crawl validation pending. |',
              'design crawler decision row')

          # Current decisions table.
          if '| Confirmed | Spawn, sector travel and capture respawn must not require' not in design:
              design = design.replace(
                  '| Confirmed | Level 1 ends when a player returns the keycard',
                  '| Confirmed | Spawn, sector travel and capture respawn must not require the player to hold their physical hands/controllers up. Low tracked hand poses must not seed locomotion inside geometry or create a first-frame launch/pin. |\n| Confirmed | The first-person/local avatar hand mesh must follow the collision-safe Gorilla hand position at contacts; raw controller rotation may remain visual input, but visible fingertips must not pass through the floor while the locomotion hand is safely clamped. |\n| Confirmed | Level 1 ends when a player returns the keycard',
                  1)
          elif 'first-person/local avatar hand mesh must follow' not in design:
              design = design.replace(
                  '| Confirmed | Spawn, sector travel and capture respawn must not require the player to hold their physical hands/controllers up.',
                  '| Confirmed | The first-person/local avatar hand mesh must follow the collision-safe Gorilla hand position at contacts; raw controller rotation may remain visual input, but visible fingertips must not pass through the floor while the locomotion hand is safely clamped. |\n| Confirmed | Spawn, sector travel and capture respawn must not require the player to hold their physical hands/controllers up.',
                  1)

          design = sub_once(
              design,
              r'^\| Confirmed \| The Crawler\'s visible long body must remain aligned.*$',
              '| Confirmed | The Crawler\'s visible body must preserve the authored Zombie Crawl proportions and Animator skeleton. The current safe baseline rigidly aligns the complete visual to the gameplay root and does not modify core bones after animation. Long-body corner deformation remains required eventually, but its earlier per-bone position and rotation implementations are failed/superseded and must not be restored. |',
              'design crawler current decision')

          # Prototype requirement for visible hands.
          if 'Validate first-person/local hand floor contact independently' not in design:
              design = design.replace(
                  '### Earlier approaches that were superseded',
                  '- Validate first-person/local hand floor contact independently from spawn placement: rest fingertips, palm edges and rotated hands on the floor. The rendered/network hand target must stop at the Gorilla collision-safe contact without visual penetration, pinning, launch impulses or loss of normal locomotion push.\n\n### Earlier approaches that were superseded',
                  1)

          # Supersede the latest Crawler prose and its pending test.
          design = sub_once(
              design,
              r'\*\*Latest Crawler visual correction:\*\*.*?(?=\n\nPending validation:)',
              r'''**Latest Crawler visual correction:** Greg's integrated PR #15 test shows that the rotation-only torso correction still produces a severely crushed/folded Zombie. The legacy `shoulderL` armature is still present in the scene hierarchy, but repository inspection shows the Zombie model/clip use their own `mixamorig:*` Generic skeleton, so that old armature is not the direct animation target. The remaining destructive input was our own post-Animator manipulation of multiple hierarchical torso rotations. PR #15 now removes all post-animation Zombie bone position/rotation writes and disables the prototype hand-bone containment. `mixamo_com` and the Zombie Animator own every skeleton transform; `CrawlerBodyPathFollower` only performs one rigid whole-visual pivot/floor alignment to the gameplay root. This intentionally gives up experimental corner bending for the next test so authored body proportions and crawl deformation can be validated in isolation. Navigation, capture, audio and Photon authority remain unchanged on the gameplay root. A future corner solution must use a rig-safe authored/IK/Animation Rigging approach and is pending, not implemented.''',
              'design latest crawler correction')

          design = sub_once(
              design,
              r'Pending validation:.*?(?=\n\n### The missing subject in Level 1)',
              r'''Pending validation: first inspect Zombie Crawl stationary and moving in a straight vent with **no post-Animator deformation**. The body must remain uncrushed and retain its authored proportions, `mixamo_com` must visibly deform the intended `mixamorig:*` limbs, and the persistent binding diagnostic must not fire. Verify rigid visual/gameplay-root alignment and render-bounds floor contact. Only after that baseline passes should corner behavior be judged: rigid clipping/sweeping at a 90-degree turn is currently a known pending limitation, not something this baseline claims to solve. If the body is still crushed with all post-Animator manipulation removed, investigate the standalone clip/Generic import binding or the authored Zombie asset itself before adding any more path correction. Then recheck patrol/chase cadence, safe-room boundaries, capture, card drops, headlamp, Photon controller handover and Quest performance.''',
              'design crawler pending paragraph')

          design = re.sub(
              r'^\| Crawler and difficulty \|.*$',
              '| Crawler and difficulty | First validate the Animator-owned Zombie baseline: authored proportions, real `mixamo_com` limb deformation, rigid gameplay-root alignment, patrol/chase/capture and both safe boundaries. Corner-body bending is currently disabled after two failed per-bone approaches; design a rig-safe deformation solution only after the clean baseline passes. |',
              design,
              count=1,
              flags=re.M)

          design = sub_once(
              design,
              r'1\. Repeatedly cold-start into the Hub.*?(?=\n\n1\. On PR #15, repeatedly drop/throw)',
              r'''1. Validate the merged PR #14 spawn reset plus PR #15's visible-hand follow-up together. Cold-start repeatedly with both hands naturally down, one controller low and both controllers low/on the lap; then press fingertips, palm edges and rotated hands against the floor. The locomotion hand and the first-person visible hand must agree on the contact boundary with no buried fingertips, pin/launch, stale velocity or failure to re-arm. Repeat Hub → Level 1, Level 1 → Hub, completion → Level 2, RETURN TO SECURITY, recentering and Crawler capture respawns.''',
              'design next prototype hand item')

          design = sub_once(
              design,
              r'1\. Validate PR #15\'s Crawler correction:.*?(?=\n\n1\. During every sector route)',
              r'''1. Validate PR #15's Crawler safe baseline: inspect Zombie Crawl stationary, then straight patrol and chase. The authored body must remain completely uncrushed and `mixamo_com` must visibly move the intended Zombie limbs. Confirm rigid chest/gameplay-root alignment and floor contact. At a 90-degree turn/junction, record any rigid wall clipping separately; corner-body deformation is intentionally disabled for this pass and must not be reintroduced until the clean skeleton baseline passes.''',
              'design next prototype crawler item')

          # ---------------- repository improvement plan ----------------
          integrated_section = r'''## September 12 integrated hand-visual, Crawler-skeleton, keycard and XR-loading retest

**Confirmed failed runtime results:** Greg's integrated PR #15 test shows that the earlier work is only partially successful. The PR #14 spawn reset improved the original hand problem—the hands no longer begin buried—but the first-person visible fingertips can still penetrate the floor and contact can feel wrong near the surface. Zombie Crawl also remains severely crushed/folded even after the first PR #15 change stopped writing torso positions and switched to rotation-only torso correction. These are failed headset results and supersede any implication that the hand-contact or Crawler-proportion defects were resolved. The keycard fall recovery and Loading overscan were not invalidated by these screenshots and remain pending their own headset checks.

**Hand source findings:** the active Bootstrap `GorillaLocomotion.Player` serializes `minimumRaycastDistance = 0.02`, while the authored `Gorilla Rig.prefab` Player default is 0.05 m and its hand follower proxy is authored at the larger contact scale. More importantly, the first-person orange/gray hands in Greg's screenshot are the local Photon avatar: `Player.prefab` has `HideLocalPlayer = 0`, `PlayerRigPrefabRepair` targets its arm IK at `PhotonVRPlayer.LeftHand` / `RightHand`, and `PhotonVRPlayer` previously copied those target positions directly from the raw XR controller transforms. Gorilla locomotion could therefore clamp its separate followers safely while the visible IK targets continued below the floor.

**Crawler source findings:** the scene still contains the legacy MiniGamesKid armature (`shoulderL` is present), matching what Greg saw in Scene view. However the Zombie FBX is a separate Generic rig and `mixamo.com.anim` binds to `mixamorig:Hips/.../mixamorig:LeftShoulder/...`; the old `shoulderL` armature is not the Zombie clip's animation target. The failed PR #15 follower was still overwriting world rotations on several hierarchical Zombie torso bones after Animator evaluation. Independent parent/child world-rotation correction can fold the hierarchy even when bone positions/lengths are preserved. The rotation-only approach is therefore failed and superseded, just like the earlier position-warp approach.

**Implemented follow-up on `fix/runtime-keycard-crawler-loading`:** Gorilla locomotion now clamps `minimumRaycastDistance` to at least 0.05 m at runtime so the active Bootstrap override cannot shrink the contact sphere below the authored hand proxy. `PhotonVRPlayer` runs after normal Gorilla locomotion and uses the collision-safe Gorilla follower for each local/network hand **position**, while retaining the raw tracked controller **rotation**. For Zombie Crawl, `CrawlerBodyPathFollower` has been reduced to a rigid visual aligner: it performs no torso or hand bone writes at all, and `mixamo_com` / the Zombie Animator own every bone. The complete Zombie visual is aligned/grounded as one hierarchy under the existing gameplay/NavMesh root. Experimental long-body corner bending is deliberately disabled and moves back to **pending implementation** until a rig-safe IK/Animation Rigging solution is designed after the authored baseline is proven. Source Integrity run #88 passes these new contracts.

**Pending headset validation:** for hands, cold-start with hands down, then press fingertips, palm edges and rotated hands against floor/walls; visible avatar contact must match Gorilla locomotion contact with no penetration, pinning, launch or loss of normal push. Repeat travel, recenter and capture respawn, then two clients. For the Crawler, first test stationary and straight patrol/chase only: authored proportions must remain stable and `mixamo_com` must visibly deform the `mixamorig:*` skeleton. Corner clipping is a known limitation for this baseline and should be recorded separately. If the Zombie remains crushed with all post-Animator bone manipulation removed, investigate animation-clip/Generic-rig compatibility or the source asset before adding more path deformation. Continue the previously planned keycard tunnel and Loading full-FOV tests separately.'''

          if '## September 12 integrated hand-visual, Crawler-skeleton, keycard and XR-loading retest' not in plan:
              marker = '## September 12 spawn-hand initialization follow-up'
              if marker not in plan:
                  raise SystemExit('plan: spawn-hand marker missing')
              plan = plan.replace(marker, integrated_section + '\n\n' + marker, 1)

          # Update the older spawn section so it no longer claims validation is merely pending without the failed retest.
          plan = sub_once(
              plan,
              r'## September 12 spawn-hand initialization follow-up.*?(?=\n\n## September 11 Hub and Level 1 spawn/arrival stability follow-up)',
              r'''## September 12 spawn-hand initialization follow-up

**Confirmed original failure:** players could spawn with one or both Gorilla locomotion hands stuck in the floor unless the physical controllers were already held up. PR #14 implemented a collision sweep/suppression reset and is merged to `main`.

**Integrated retest result:** **partial improvement, still failed overall.** Greg confirms the hands no longer start buried, but the visible first-person fingertips can still penetrate the floor and contact can feel wrong near that boundary. The original spawn-cache fix remains useful; the remaining defect is the mismatch between the active contact radius / collision-safe followers and the visible local Photon avatar described in the integrated follow-up above.

**Current source follow-up on PR #15:** retain PR #14's safe reset, enforce a minimum 0.05 m Gorilla hand-contact radius, and drive local/network avatar hand positions from the collision-safe followers while keeping tracked controller rotations. Source Integrity passes. **Pending:** repeat cold starts, low/lap poses, fingertip/palm floor contact, lift/re-lower, recenter, every travel route, capture respawn and two-client presentation. Do not mark the hand defect resolved until both locomotion behavior and visible hand contact pass in headset.''',
              'plan spawn section')

          # Replace the historical Crawler correction section with the current implementation evolution.
          plan = sub_once(
              plan,
              r'## September 11 Crawler visual-path and animation correction.*?(?=\n\n## September 11 Level 1 visibility and Crawler runtime follow-up)',
              r'''## September 11 Crawler visual-path and animation correction

**Runtime history and latest failure:** the initial rigid replacement slid/offset outside vents; the first recent-path follower then wrote torso positions and visibly squashed the hierarchy. PR #15's first correction removed position writes but still applied independent post-Animator world rotations to hips/spine/chest. Greg's September 12 integrated screenshot confirms that rotation-only version also **fails**: Zombie Crawl is severely folded/crushed. This supersedes all prior claims that the recent-path torso deformation itself is a viable implementation.

**Armature clarification:** Level 1 still contains the legacy MiniGamesKid skeleton and its `shoulderL` transform, which explains the old armature visible in Greg's Scene-view screenshot. The Zombie visual is nevertheless a separate Generic FBX rig; its crawl clip binds to `mixamorig:*` paths. The old `shoulderL` hierarchy is therefore cleanup debt and a source of editor confusion, but it is not the animation skeleton receiving the Zombie crawl clip.

**Current source baseline on PR #15:** `CrawlerVisualController` still owns visual replacement, authored-world-scale preservation, explicit `mixamo_com` state control/probing and navigation-speed matching. `CrawlerBodyPathFollower` now performs **zero post-Animator bone or hand writes**. It only identifies a Zombie chest/spine/hips anchor, translates the complete visual hierarchy to the gameplay leader, grounds the whole render hierarchy once, and leaves every skeleton transform to the Animator. `ResetTrail()` remains only as a compatibility hook and performs no deformation. Photon/navigation/capture authority remains on the gameplay root. Corner-body bending is intentionally disabled and is now pending a rig-safe authored/IK/Animation Rigging design rather than another direct Transform warp.

**Pending validation:** establish the clean baseline first. In a straight vent, the Zombie must retain authored proportions while stationary, patrolling and chasing; `mixamo_com` must visibly move the intended limbs with no persistent binding diagnostic; rigid chest/root alignment and floor contact must be correct. At corners, record rigid clipping/sweeping as a known pending limitation rather than attempting to fix it during the baseline test. Only after the clean skeleton passes should a new corner-deformation prototype be designed and tested. If crushing persists now, investigate clip/import/Generic-rig compatibility or the Zombie source asset before touching bones again.''',
              'plan crawler section')

          # Current R03 status.
          plan = re.sub(
              r'^\*\*Current status, 2026-09-12:\*\* sector/vent eligibility.*$',
              '**Current status, 2026-09-12:** sector/vent eligibility and immediate patrol return remain implemented. The recent-path torso deformation attempts are now failed/superseded after headset crushing. PR #15 keeps the authoritative gameplay root and Animator-driven crawl but disables all post-Animator Zombie bone deformation; the visual is rigidly aligned as a safe baseline. Corner-body deformation is pending a rig-safe solution. Actual `mixamo.com.anim` deformation, target switching, VentGraph/NavMesh limits and headset difficulty remain runtime validation items.',
              plan,
              count=1,
              flags=re.M)

          # Preserve-monster current status paragraph, whichever historical wording is present.
          plan = sub_once(
              plan,
              r'\*\*Current status, 2026-09-12:\*\* Zombie Crawl is the visible replacement.*?(?=\n\n- Keep the gameplay root)',
              r'''**Current status, 2026-09-12:** Zombie Crawl remains the selected visual on the existing Level 1 gameplay root. Navigation, capture, Photon sync, patrol/hunt audio and proximity behavior stay on that root. Greg's latest headset screenshot shows the rotation-only recent-path follower still crushed the Zombie skeleton. PR #15 now preserves the authored Animator skeleton completely: no post-Animator torso positions, rotations or hand corrections are written. The whole Zombie visual is rigidly aligned/grounded to the gameplay root. The old MiniGamesKid armature remains in the scene hierarchy but is not the Zombie clip's `mixamorig:*` target. Unity/headset must prove the authored crawl baseline before any rig-safe corner deformation is reintroduced.''',
              'plan preserve monster status')

          # Bullet rules in preserve-monster section.
          plan = plan.replace(
              '- Keep navigation responsible for world movement. The Animator supplies crawl limb motion; recent-path correction supplies large-scale torso bending. Do not restore root motion and do not network per-bone visual state.',
              '- Keep navigation responsible for world movement. The Animator supplies all current Zombie skeletal motion. Do not restore root motion, do not network per-bone visual state, and do not add post-Animator bone deformation until a separate rig-safe solution is validated.')
          plan = re.sub(
              r'^- Never force hierarchical chest/spine/hips.*$',
              '- Do not force hierarchical chest/spine/hips world positions **or rotations** after Animator evaluation. Both direct-transform approaches failed in headset. Keep the Animator-owned skeleton baseline until a rig-safe IK/Animation Rigging corner solution is proven.',
              plan,
              count=1,
              flags=re.M)

          # Implementation order rows.
          plan = re.sub(
              r'^\| 2 Crawler and chase Large \|.*$',
              '| 2 Crawler and chase Large | First validate the Animator-owned Zombie baseline plus R02-R04: authored proportions, real crawl binding, rigid visual/gameplay-root alignment, local headlamp, zone eligibility, navigation/audio and controller handover. Design rig-safe corner deformation only after that passes. | The Crawler visibly crawls at intended scale without crushing/folding, remains aligned to the gameplay root on both clients, and gameplay chase/capture/audio/headlamp behavior works. Corner bending has its own later acceptance gate. |',
              plan,
              count=1,
              flags=re.M)

          # Recommended validation session wholesale.
          plan = sub_once(
              plan,
              r'### Recommended next validation session.*?(?=\n\n## Acceptance checks and remaining choices)',
              r'''### Recommended next validation session

Test the latest `fix/runtime-keycard-crawler-loading` head as one integrated pass. Source Integrity is green, but Greg's prior screenshots are recorded as failed runtime evidence.

Start with the hands. Cold-start with both controllers naturally down, then one hand low and both on the lap. Press fingertips, palm edges and several wrist rotations into a flat floor. The first-person visible hand must stop at the same collision-safe boundary used by Gorilla locomotion; no visible fingertip penetration, pin/launch, stale velocity or lost locomotion push is acceptable. Repeat recentering, Hub → Level 1, Level 1 → Hub, completion → Level 2, RETURN TO SECURITY and Crawler respawns. Then repeat with two clients and verify remote hand positions remain plausible.

Next isolate the Crawler skeleton before judging corners. Observe Zombie Crawl stationary, then straight patrol and chase. Its authored proportions must remain stable with no folding/crushing, `mixamo_com` must visibly deform the intended `mixamorig:*` limbs, and the binding diagnostic must remain clear. Confirm rigid body/gameplay-root alignment and floor contact. At a 90-degree turn/junction, record rigid wall clipping separately; corner deformation is intentionally disabled in this baseline. If crushing remains in a straight, investigate the animation clip/Generic import/source asset rather than adding transform correction.

Then finish the independent PR #15 checks: normal and deliberate floor-tunnel keycard drops (valid drops stay put; out-of-bounds drops recover without stale motion), and every Loading route while looking fully left/right/up/down for zero stereo/peripheral scene bleed. Continue with headlamp, capture, safe boundaries, audio, Photon controller handover and Quest performance only after the two failed screenshot cases have clean baselines.''',
              'plan recommended validation')

          # Acceptance rows.
          plan = re.sub(
              r'^\| Spawn/arrival stability \|.*$',
              '| Spawn/arrival stability | Repeated cold starts and every travel/respawn route place the body and Gorilla hand followers safely. Hands may begin naturally down. The **first-person visible Photon hand/IK target must also use the collision-safe follower position**, so fingertips/palm edges do not visibly pass through floor/walls while the controller rotation remains tracked. No persistent penetration, jitter, pin, launch, stale velocity, delayed kick or stuck/re-arm failure. |',
              plan,
              count=1,
              flags=re.M)
          plan = re.sub(
              r'^\| Crawler presentation \|.*$',
              '| Crawler presentation | Immediate baseline: Zombie Crawl retains authored proportions with **zero post-Animator bone manipulation**, `mixamo_com` visibly deforms the intended skeleton, the complete visual stays rigidly aligned/grounded to the gameplay root, and no crushing/folding occurs while stationary or moving straight. Rigid corner clipping is currently a known pending limitation. A later rig-safe corner-deformation implementation must get a separate headset acceptance pass before restoring the requirement that the long body bends through turns. |',
              plan,
              count=1,
              flags=re.M)

          if '| Keycard out-of-bounds recovery |' not in plan:
              plan = plan.replace(
                  '| Capture and floor recovery |',
                  '| Keycard out-of-bounds recovery | A normal dropped card remains on valid floor. If it tunnels below valid geometry, the owner card returns promptly to its recorded original spawn with velocity/angular velocity cleared and remains grabbable; another player\'s card is unchanged. |\n| Capture and floor recovery |',
                  1)
          if '| Loading coverage |' not in plan:
              plan = plan.replace(
                  '| Exit and return |',
                  '| Loading coverage | Every travel route fully covers both XR eyes and peripheral left/right/top/bottom view with the Loading presentation; no source/destination sliver or clear-color mismatch is visible while turning the headset. |\n| Exit and return |',
                  1)

          # Automated source check summary.
          plan = sub_once(
              plan,
              r'`Tools/validate_level1_contracts\.py` now covers.*?(?=\n\nThese checks deliberately stop)',
              r'''`Tools/validate_level1_contracts.py` now protects the integrated runtime-fix source contracts: safe-boundary/capture/headlamp/floor-recovery behavior; PR #14's reset-hand sweep/suppression; the 0.05 m minimum visual hand-contact radius; first-person/network avatar hand positions sourced from Gorilla's collision-safe followers with tracked rotations retained; spawn-relative keycard recovery; Loading overscan; and the current Animator-owned Zombie baseline. The Crawler contract explicitly rejects post-Animator bone position/rotation writes and the failed `ApplyBodyPath` / hand-containment deformation path. Repository integrity, source syntax, metadata/GUID, JSON, merge-marker and whitespace checks remain in the Source Integrity workflow.''',
              'plan automated source paragraph')

          design_path.write_text(design, encoding='utf-8')
          plan_path.write_text(plan, encoding='utf-8')
          PY

          git diff --check
          git diff -- docs/design-and-lore.md docs/repository-improvement-plan.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          if git diff --cached --quiet; then
            echo "No documentation changes were needed."
            exit 0
          fi
          git commit -m "Record failed hand and Crawler runtime retest"
          git push origin HEAD:fix/runtime-keycard-crawler-loading
