name: Apply reusable card review
on:
  push:
    branches: [feature/keycard-reader-light-feedback]
    paths: [.github/workflows/card-reuse-review.yml]
permissions:
  contents: write
concurrency:
  group: apply-reusable-card-review
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'GregStephen/RunawayChimps' && github.ref == 'refs/heads/feature/keycard-reader-light-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply only reviewed plaintext patches and verify exact source hashes
        shell: python
        run: |
          import json, pathlib, subprocess
          for number in (1, 2, 3, 5, 6, 7):
              patch = f'Tools/_card_review_{number}.patch'
              subprocess.run(['git', 'apply', '--check', patch], check=True)
              subprocess.run(['git', 'apply', patch], check=True)
          expected = json.loads(pathlib.Path('Tools/_card_review_expected.json').read_text())
          for name, sha in expected.items():
              actual = subprocess.check_output(['git','hash-object',name], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Reviewed content mismatch: {name}: {actual} != {sha}')
          print(f'PASS: all {len(expected)} reviewed output files match their exact expected Git blob hashes.')
      - name: Execute production card-consumption state
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Tools/CardSystemHarness/CardSystemHarness.csproj --configuration Release | tee "$RUNNER_TEMP/card-managed-tests.log"
      - name: Install source-parser dependencies
        run: python -m pip install --disable-pip-version-check 'tree-sitter==0.25.2' 'tree-sitter-c-sharp==0.23.5'
      - name: Validate complete reviewed repository
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'm_EditorVersion: 2022.3.55f1' ProjectSettings/ProjectVersion.txt
          python Tools/validate_source.py --syntax
          python Tools/validate_repository_integrity.py
          python Tools/validate_level1_contracts.py
          python Tools/validate_keycard_reader_contracts.py
          python Tools/validate_interaction_safety.py
          python Tools/validate_pr15_review_hardening.py
          python Tools/validate_security_boot.py
          python Tools/validate_threat_feedback.py
          python -m compileall -q Tools
          if git grep -n -E '^(<<<<<<< .+|>>>>>>> .+|=======$)' -- .; then
            echo 'ERROR: unresolved merge markers'
            exit 1
          fi
          git diff --check
      - name: Record actual validation and remove temporary review machinery
        shell: python
        run: |
          import json, os, pathlib, re, subprocess
          expected = json.loads(pathlib.Path('Tools/_card_review_expected.json').read_text())
          log = pathlib.Path(os.environ['RUNNER_TEMP'], 'card-managed-tests.log').read_text()
          match = re.search(r'PASS: (\d+) assertions against production CardConsumptionState', log)
          if match is None:
              raise SystemExit('Managed production-state result was not found.')
          record = (f"**Validated source/managed result, 2026-09-15 UTC:** Apply reusable card review run `{os.environ['GITHUB_RUN_ID']}` "
                    f"verified all 26 reviewed output hashes and passed the full source suite on the patched worktree based on `{os.environ['GITHUB_SHA']}`. "
                    f"The .NET harness compiled the actual production `CardConsumptionState` and passed **{int(match.group(1)):,} assertions** across 1,000 repeated sequences. "
                    "The source suite passed Unity version declaration, C# syntax/reference and enabled-scene checks, repository metadata integrity, Level 1/keycard/reuse/interaction/PR15/security/threat contracts, eight negative source fixtures, fourteen coordinate-math fixtures, Python compilation, merge-marker and whitespace checks. "
                    "This is source and managed-state evidence only. The 42 authored Unity Play Mode cases, Unity import/compile, PhysX/XRI/controller input, travel, Photon and headset/Quest validation have not been executed by this runner. The exact final published head and read-only CI result are recorded on PR #23.")
          for name in ('docs/design-and-lore.md','docs/repository-improvement-plan.md'):
              path = pathlib.Path(name)
              text = path.read_text()
              marker = '<!-- reusable-card-validation-record -->'
              if text.count(marker) != 1:
                  raise SystemExit(f'Expected one validation marker in {name}')
              path.write_text(text.replace(marker, record))
          temporary = sorted(pathlib.Path('Tools').glob('_card_review*'))
          temporary.append(pathlib.Path('.github/workflows/card-reuse-review.yml'))
          for path in temporary:
              if path.is_file():
                  path.unlink()
          subprocess.run(['git','add','--',*expected.keys(),*[str(p) for p in temporary]], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
      - name: Publish reviewed corrections without rewriting branch history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden reusable card authorization, consumption, recovery and setup validation'
          git push origin HEAD:feature/keycard-reader-light-feedback
      - name: Capture source review evidence
        if: always()
        shell: bash
        run: |
          git diff --no-ext-diff HEAD > "$RUNNER_TEMP/card-review-worktree.diff"
          git log -1 --format='%H %s' > "$RUNNER_TEMP/card-review-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reusable-card-review-evidence
          path: |
            ${{ runner.temp }}/card-managed-tests.log
            ${{ runner.temp }}/card-review-worktree.diff
            ${{ runner.temp }}/card-review-head.txt
          retention-days: 7
