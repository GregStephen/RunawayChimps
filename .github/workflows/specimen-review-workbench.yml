name: Specimen review workbench
on:
  push:
    branches: [feature/reactive-specimen-jar]
    paths: [Tools/_specimen_review.py]
permissions:
  contents: write
concurrency:
  group: specimen-review-publish
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install existing source parser dependencies
        run: python -m pip install 'tree-sitter==0.25.2' 'tree-sitter-c-sharp==0.23.5'
      - name: Apply reviewed fixes, validate complete checkout and publish
        run: python Tools/_specimen_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specimen-review-validation
          path: /tmp/specimen-review-validation.json
          if-no-files-found: ignore
          retention-days: 7
