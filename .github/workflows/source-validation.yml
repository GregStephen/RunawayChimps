name: Source validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up managed state test runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Execute production card-consumption state tests
        run: dotnet run --project Tools/CardSystemHarness/CardSystemHarness.csproj --configuration Release

      - name: Execute production hand-impact contact state tests
        run: dotnet run --project Tools/HandImpactHarness/HandImpactHarness.csproj --configuration Release

      - name: Verify default hand-impact audio asset
        run: python Tools/Audio/prepare_hand_tap.py --check

      - name: Install syntax-parser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'tree-sitter==0.25.2' \
            'tree-sitter-c-sharp==0.23.5'

      - name: Verify Unity editor version
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys
          expected = '2022.3.62f3'
          expected_revision = '96770f904ca7'
          text = Path('ProjectSettings/ProjectVersion.txt').read_text(encoding='utf-8-sig')
          versions = re.findall(r'^m_EditorVersion:[ \t]*(\S+)[ \t]*$', text, re.MULTILINE)
          revisions = re.findall(r'^m_EditorVersionWithRevision:[ \t]*(.+?)[ \t]*$', text, re.MULTILINE)
          wanted_revision = f'{expected} ({expected_revision})'
          if versions != [expected] or revisions != [wanted_revision]:
              print(f'ERROR: expected exactly one {expected} / {wanted_revision}; found {versions!r} / {revisions!r}.')
              sys.exit(1)
          print(f'PASS: Unity editor version and revision are {wanted_revision}.')

      - name: Validate first-party source and enabled scenes
        run: python Tools/validate_source.py --syntax

      - name: Validate Unity repository integrity
        run: python Tools/validate_repository_integrity.py

      - name: Validate Level 1 source contracts
        run: python Tools/validate_level1_contracts.py

      - name: Validate startup floor safety contracts
        run: python Tools/validate_spawn_floor_contracts.py

      - name: Validate keycard reader source contracts
        run: python Tools/validate_keycard_reader_contracts.py

      - name: Validate interaction safety boundaries
        run: python Tools/validate_interaction_safety.py

      - name: Validate PR15 review hardening
        run: python Tools/validate_pr15_review_hardening.py

      - name: Validate security boot source contracts
        run: python Tools/validate_security_boot.py

      - name: Validate local threat feedback contracts
        run: python Tools/validate_threat_feedback.py

      - name: Validate launch presentation source contracts
        run: python Tools/validate_launch_presentation.py

      - name: Compile Python validation tools
        run: python -m compileall -q Tools

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<< .+|>>>>>>> .+|=======$)' -- .; then
            echo 'ERROR: unresolved merge-conflict markers found.'
            exit 1
          fi
          echo 'PASS: no unresolved merge-conflict markers.'

      - name: Check human-authored text whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO_SHA='0000000000000000000000000000000000000000'

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            RANGE="$PR_BASE_SHA...HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" != "$ZERO_SHA" ]]; then
            RANGE="$PUSH_BEFORE_SHA...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            RANGE='HEAD^..HEAD'
          else
            RANGE='HEAD'
          fi

          # Unity intentionally serializes many empty YAML values with a trailing space
          # (for example `userData: ` and `value: `). Checking those generated scene,
          # asset and .meta files would make valid Unity saves fail CI. Keep whitespace
          # enforcement on human-authored source, docs and configuration instead.
          git diff --check "$RANGE" -- \
            '*.cs' '*.py' '*.md' '*.json' '*.yml' '*.yaml' '*.sh' '*.txt' \
            '*.asmdef' '*.asmref' '*.xml' '*.csproj' '*.props' '*.targets' \
            '*.toml' '*.ini' '*.cfg' '*.config' '*.uxml' '*.uss' \
            '.gitignore' '.gitattributes'
