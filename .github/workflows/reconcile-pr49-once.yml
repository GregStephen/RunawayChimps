name: Reconcile PR49 documentation once

on:
  push:
    branches: ['docs/mvp-roadmap-current-main']
    paths: ['.github/workflows/reconcile-pr49-once.yml']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact reviewed revisions
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git fetch --no-tags --depth=1 origin f9edea67af08ff7c35d043e05ad66a5615a9aeb2 57dd862cf7c8c848bcb9954d8c0c97e8c93e48cd 7d32f3a5ab935a1e0e7deb63e91d1751a1e6b74f
      - name: Run pinned reconciliation with inherited EOF preservation
        shell: python
        run: |
          import subprocess
          import textwrap
          workflow = subprocess.check_output(['git', 'show', '7d32f3a5ab935a1e0e7deb63e91d1751a1e6b74f:.github/workflows/reconcile-pr49-once.yml'], text=True)
          start = '      - name: Reconcile and verify documentation preservation\n        shell: python\n        run: |\n'
          end = '      - name: Commit documentation without changing other branch work\n'
          assert workflow.count(start) == workflow.count(end) == 1
          script = textwrap.dedent(workflow.split(start, 1)[1].split(end, 1)[0])
          old = "    assert text.endswith('\\n')"
          new = "    assert text.endswith('\\n') or not show(BASE if name in OVERVIEWS else SOURCE, name).endswith('\\n'), f'Unexpected EOF change: {name}'"
          assert script.count(old) == 1
          script = script.replace(old, new, 1)
          script = script.replace('the original documentation source, now being superseded', 'historical documentation source')
          exec(compile(script, 'reviewed-pr49-reconciliation', 'exec'))
      - name: Commit documentation without changing other branch work
        shell: bash
        run: |
          set -euo pipefail
          branch='docs/mvp-roadmap-current-main'
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: reconcile MVP decisions and testing guidance onto current main'
          git push origin "HEAD:refs/heads/$branch"
