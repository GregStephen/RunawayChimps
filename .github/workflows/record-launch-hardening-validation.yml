name: Record launch hardening validation

on:
  push:
    branches:
      - feature/launch-presentation-polish
    paths:
      - 'Tools/_record_launch_hardening_validation.py'
      - '.github/workflows/record-launch-hardening-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/launch-presentation-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python Tools/_record_launch_hardening_validation.py
      - name: Commit validation record
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'docs: record launch hardening source validation'
          git push origin HEAD:feature/launch-presentation-polish
