name: Facility review snapshot (temporary)
on:
  push:
    branches: ['feature/facility-announcements']
    paths: ['.github/workflows/facility-review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Bundle focused sources and one managed runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/facility-review
          git archive --format=tar.gz HEAD AGENTS.md README.md Assets/Scripts Assets/Scenes/Bootstrap.unity Assets/Scenes/Hub_Base.unity Assets/Photon/PhotonUnityNetworking/Code Assets/Photon/PhotonRealtime/Code Assets/RunawayChimps/FacilityAnnouncements Assets/RunawayChimps/FacilityAnnouncements.meta 'Assets/TextMesh Pro/Resources/Fonts & Materials/LiberationSans SDF.asset' 'Assets/TextMesh Pro/Resources/Fonts & Materials/LiberationSans SDF.asset.meta' Tools docs/design-and-lore.md docs/repository-improvement-plan.md docs/facility-announcements.md ProjectSettings Packages .github/workflows > /tmp/facility-review/source.tar.gz
          git rev-parse HEAD > /tmp/facility-review/HEAD.txt
          cd /usr/share/dotnet
          sdk=$(ls -d sdk/8.* | sort -V | tail -1)
          fxr=$(ls -d host/fxr/8.* | sort -V | tail -1)
          refs=$(ls -d packs/Microsoft.NETCore.App.Ref/8.* | sort -V | tail -1)
          host=$(ls -d packs/Microsoft.NETCore.App.Host.linux-x64/8.* | sort -V | tail -1)
          runtime=$(ls -d shared/Microsoft.NETCore.App/8.* | sort -V | tail -1)
          tar -czf /tmp/facility-review/dotnet8.tar.gz dotnet "$sdk" "$fxr" "$refs" "$host" "$runtime"
          du -h /tmp/facility-review/*
      - uses: actions/upload-artifact@v4
        with:
          name: facility-review-focused
          path: /tmp/facility-review/
          retention-days: 2
