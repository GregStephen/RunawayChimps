name: Publish cognitive review fixes
on:
  push:
    branches: [feature/primate-cognitive-test]
    paths: [.github/workflows/cognitive-review-finalize.yml]
permissions:
  contents: write
jobs:
  reviewed-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.5
      - name: Apply checksum-guarded reviewed changes
        run: python Tools/PrimateCognitive/apply_review.py
      - name: Verify exact locally reviewed file contents and baseline
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess
          expected = json.loads(Path('Tools/PrimateCognitive/review-expected.json').read_text())
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == wanted, 'Reviewed file mismatch: ' + name
          print('PASS: all 13 published review files match locally validated bytes.')
          assert Path('ProjectSettings/ProjectVersion.txt').read_text().strip() == 'm_EditorVersion: 2022.3.62f3\nm_EditorVersionWithRevision: 2022.3.62f3 (96770f904ca7)'
          Path('/tmp/review-expected.json').write_text(json.dumps(expected, indent=2))
          subprocess.run(['git', 'add', '--', *expected], check=True)
      - name: Run production rules and adapters plus card regressions
        run: |
          dotnet run --project Tools/PrimateCognitiveHarness/PrimateCognitiveHarness.csproj --configuration Release
          dotnet run --project Tools/PrimateCognitiveAdapterHarness/PrimateCognitiveAdapterHarness.csproj --configuration Release
          dotnet run --project Tools/CardSystemHarness/CardSystemHarness.csproj --configuration Release
      - name: Validate shipped cognitive assets and rig boundaries
        run: |
          python Tools/PrimateCognitive/build_assets.py
          python Tools/PrimateCognitive/validate_assets.py
          python Tools/PrimateCognitive/validate_rig_contract.py
      - name: Run full repository source checks
        run: |
          python Tools/validate_source.py --syntax
          python Tools/validate_repository_integrity.py
          python Tools/validate_level1_contracts.py
          python Tools/validate_spawn_floor_contracts.py
          python Tools/validate_keycard_reader_contracts.py
          python Tools/validate_interaction_safety.py
          python Tools/validate_pr15_review_hardening.py
          python Tools/validate_security_boot.py
          python Tools/validate_threat_feedback.py
          python Tools/validate_launch_presentation.py
          python -m compileall -q Tools
      - name: Remove temporary helpers and publish only reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/primate-cognitive-test
          git rm .github/workflows/cognitive-review-snapshot.yml .github/workflows/cognitive-review-finalize.yml Tools/PrimateCognitive/apply_review.py Tools/PrimateCognitive/review-expected.json
          git diff --cached --check
          git diff --exit-code
          python - <<'PY'
          import json, subprocess
          allowed = set(json.load(open('/tmp/review-expected.json')))
          allowed.update(['.github/workflows/cognitive-review-snapshot.yml', '.github/workflows/cognitive-review-finalize.yml', 'Tools/PrimateCognitive/apply_review.py', 'Tools/PrimateCognitive/review-expected.json'])
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed <= allowed, 'Unexpected staged paths: ' + str(changed - allowed)
          PY
          remote_head=$(git ls-remote origin refs/heads/feature/primate-cognitive-test | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(cognitive): preserve delayed handshakes and clear upper button housing'
          git push origin HEAD:feature/primate-cognitive-test
      - name: Capture published revision and reviewed byte identities
        if: always()
        run: |
          mkdir -p /tmp/review-evidence
          git rev-parse HEAD > /tmp/review-evidence/head.txt
          git diff --stat 9addd2d7115fdc509e8336600656a44de08964a8 HEAD > /tmp/review-evidence/diff-stat.txt
          git ls-files -s > /tmp/review-evidence/tracked-index.txt
          cp /tmp/review-expected.json /tmp/review-evidence/expected.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cognitive-reviewed-evidence
          path: /tmp/review-evidence/
          retention-days: 7
