name: Apply interaction review

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - .github/workflows/apply-interaction-review.yml
      - Tools/_apply_interaction_review.py

permissions:
  contents: write

concurrency:
  group: apply-pr23-interaction-review
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'GregStephen/RunawayChimps' && github.ref == 'refs/heads/feature/keycard-reader-light-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply scoped reviewed edits
        run: python Tools/_apply_interaction_review.py
      - name: Install existing source-parser dependencies
        run: python -m pip install --disable-pip-version-check 'tree-sitter==0.25.2' 'tree-sitter-c-sharp==0.23.5'
      - name: Validate corrected source
        run: |
          set -euo pipefail
          grep -Fx 'm_EditorVersion: 2022.3.55f1' ProjectSettings/ProjectVersion.txt
          python Tools/validate_source.py --syntax
          python Tools/validate_repository_integrity.py
          python Tools/validate_level1_contracts.py
          python Tools/validate_keycard_reader_contracts.py
          python Tools/validate_interaction_safety.py
          python Tools/validate_pr15_review_hardening.py
          python Tools/validate_security_boot.py
          python Tools/validate_threat_feedback.py
          python -m compileall -q Tools
          if git grep -n -E '^(<<<<<<< .+|>>>>>>> .+|=======$)' -- .; then
            echo 'ERROR: unresolved merge markers'
            exit 1
          fi
          git diff --check
      - name: Capture review diff
        if: always()
        run: git diff --no-ext-diff > "$RUNNER_TEMP/interaction-review.diff"
      - name: Attach review diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-review-diff
          path: ${{ runner.temp }}/interaction-review.diff
      - name: Record successful source checks
        shell: python
        run: |
          from pathlib import Path
          import os
          revision = os.environ['GITHUB_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          note = ('\n**Validated source result, 2026-09-15 UTC:** the reviewed patch applied to `' + revision + '` passed the Unity 2022.3.55f1 declaration check, C# syntax/reference and five-scene checks, repository integrity, Level 1/keycard/PR15/security/threat contracts, all eight negative interaction fixtures and fourteen rotated/scaled math fixtures, Python compilation, merge-marker and whitespace checks in Apply interaction review run `' + run_id + '`. This validates the patched source worktree, not Unity compilation or runtime. The final published commit and its read-only PR check are recorded on PR #23. Unity/XRI/Photon/headset validation remains pending.\n')
          for name in ('docs/design-and-lore.md', 'docs/repository-improvement-plan.md'):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n' + note, encoding='utf-8')
      - name: Remove one-time applicator and publish verified correction
        run: |
          set -euo pipefail
          # The Actions token cannot update workflow configuration. Publish that
          # already-reviewed read-only step separately through the GitHub connector.
          git restore -- .github/workflows/source-validation.yml
          rm Tools/_apply_interaction_review.py .github/workflows/apply-interaction-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Assets/Scripts/NewGorillaLocomotionScripts/Player.cs Assets/Scripts/HeldItemCollisionMode.cs Assets/Scripts/KeyCard.cs Assets/Scripts/KeycardReaderLightController.cs Assets/Scripts/KeyBox.cs Assets/Scripts/KeycardLockProgressIndicator.cs Tools/validate_keycard_reader_contracts.py docs/design-and-lore.md docs/repository-improvement-plan.md Tools/_apply_interaction_review.py .github/workflows/apply-interaction-review.yml
          git diff --cached --check
          git commit -m 'Harden card release, live reader overlap and completion retry interactions'
          git push origin HEAD:feature/keycard-reader-light-feedback
