name: Apply interaction review

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - .github/workflows/apply-interaction-review.yml
      - Tools/_apply_interaction_review.py

permissions:
  contents: write

concurrency:
  group: apply-pr23-interaction-review
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'GregStephen/RunawayChimps' && github.ref == 'refs/heads/feature/keycard-reader-light-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply scoped reviewed edits
        run: python Tools/_apply_interaction_review.py
      - name: Install existing source-parser dependencies
        run: python -m pip install --disable-pip-version-check 'tree-sitter==0.25.2' 'tree-sitter-c-sharp==0.23.5'
      - name: Validate corrected source
        run: |
          set -euo pipefail
          grep -Fx 'm_EditorVersion: 2022.3.55f1' ProjectSettings/ProjectVersion.txt
          python Tools/validate_source.py --syntax
          python Tools/validate_repository_integrity.py
          python Tools/validate_level1_contracts.py
          python Tools/validate_keycard_reader_contracts.py
          python Tools/validate_interaction_safety.py
          python Tools/validate_pr15_review_hardening.py
          python Tools/validate_security_boot.py
          python Tools/validate_threat_feedback.py
          python -m compileall -q Tools
          if git grep -n -E '^(<<<<<<< .+|>>>>>>> .+|=======$)' -- .; then
            echo 'ERROR: unresolved merge markers'
            exit 1
          fi
          git diff --check
      - name: Capture review diff
        if: always()
        run: git diff --no-ext-diff > "$RUNNER_TEMP/interaction-review.diff"
      - name: Attach review diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-review-diff
          path: ${{ runner.temp }}/interaction-review.diff
      - name: Remove one-time applicator and publish verified correction
        run: |
          set -euo pipefail
          rm Tools/_apply_interaction_review.py .github/workflows/apply-interaction-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Assets/Scripts/NewGorillaLocomotionScripts/Player.cs Assets/Scripts/HeldItemCollisionMode.cs Assets/Scripts/KeyCard.cs Assets/Scripts/KeycardReaderLightController.cs Assets/Scripts/KeyBox.cs Assets/Scripts/KeycardLockProgressIndicator.cs Tools/validate_keycard_reader_contracts.py .github/workflows/source-validation.yml docs/design-and-lore.md docs/repository-improvement-plan.md Tools/_apply_interaction_review.py .github/workflows/apply-interaction-review.yml
          git diff --cached --check
          git commit -m 'Harden card release, live reader overlap and completion retry interactions'
          git push origin HEAD:feature/keycard-reader-light-feedback
