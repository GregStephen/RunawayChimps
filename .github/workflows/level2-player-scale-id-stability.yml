name: Preserve Level 2 generated object IDs
on:
  push:
    paths:
      - '.github/workflows/level2-player-scale-id-stability.yml'
jobs:
  stabilize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/level2-player-scale-interactions
          fetch-depth: 0
      - name: Move disabled player guide to end of authored nodes
        shell: python
        run: |
          from pathlib import Path
          p=Path('Tools/Level2Blockout/build_level2.py'); s=p.read_text()
          early="player_scale_group=node('14_Player_Interaction_Scale_Guide__Enable_to_Check_Fit',root,active=False,kind='empty')\n"
          assert early in s
          s=s.replace(early,'',1)
          guide_start=s.index('# Disabled player interaction-scale guide derived from the active Bootstrap Gorilla rig.')
          guide_end=s.index('# Historical exit shutter visual remains inactive; gate + blocker are authoritative blockout visuals.',guide_start)
          guide=s[guide_start:guide_end]
          s=s[:guide_start]+s[guide_end:]
          insert=s.index('# Historical group hidden.')
          late=early+'\n'+guide
          s=s[:insert]+late+s[insert:]
          p.write_text(s)
      - name: Regenerate and validate
        run: |
          python Tools/Level2Blockout/build_level2.py
          python Tools/Level2Blockout/validate_level2.py
          python -m compileall -q Tools
          git diff --check
      - name: Commit stable generated IDs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tools/Level2Blockout/build_level2.py Tools/Level2Blockout/layout.json Tools/Level2Blockout/validation.json Assets/RunawayChimps/Level2Blockout/Prefabs/Level2_Blockout.prefab Assets/RunawayChimps/Level2Blockout/Scenes/Level2_BehavioralConditioning_Blockout.unity
          git diff --cached --check
          git commit -m 'Keep Level 2 player guide IDs isolated'
          git push origin HEAD:fix/level2-player-scale-interactions
