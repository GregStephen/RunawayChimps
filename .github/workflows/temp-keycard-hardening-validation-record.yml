name: Temporary keycard hardening validation record

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - .github/workflows/temp-keycard-hardening-validation-record.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback
          fetch-depth: 0

      - name: Record successful hardened source validation
        shell: python
        run: |
          from pathlib import Path

          updates = {
              Path('docs/design-and-lore.md'): [
                  '### Source validation update',
                  '**Validated source check, 2026-09-14:** PR #23 Source Integrity passed on the hardened keycard implementation (`2e24f42`), including C# syntax parsing, repository integrity, Level 1 contracts, the expanded keycard-reader contracts, existing review/security/threat contracts, merge-marker checks, and human-authored whitespace checks.',
                  '**Runtime validation remains pending:** Unity 2022.3.55f1 still needs to prove held-before-entry and held-after-entry scans, wrong-card rejection, exactly-once consumption, persistent 0/2 -> 1/2 -> 2/2 progress, Level 1 completion travel, final explicit lock-panel binding/placement, two-client Photon independence, and Quest/headset presentation.',
              ],
              Path('docs/repository-improvement-plan.md'): [
                  '### Source validation update',
                  '**Validated source check, 2026-09-14:** the hardened PR #23 head passed Source Integrity at `2e24f42`. The expanded contract now proves explicit reader/card credentials, Level 1 card Rigidbody/collider/XR-grab serialization, in-zone retry source wiring, deterministic reader/panel objective binding, progress-panel lamp/material wiring, and the existing repository-wide source contracts.',
                  '**Runtime validation remains pending:** Unity 2022.3.55f1 import/compile and Play Mode still need to prove held-before-entry and held-after-entry scans, wrong-card rejection, exactly-once consumption, 0/2 -> 1/2 -> 2/2 persistence, Level 1 travel, explicit panel binding/placement, two-client personal independence, and Quest/headset presentation.',
              ],
          }

          for path, paragraphs in updates.items():
              text = path.read_text(encoding='utf-8')
              marker = paragraphs[1]
              if marker not in text:
                  text = text.rstrip() + '\n\n' + '\n\n'.join(paragraphs) + '\n'
              path.write_text(text.rstrip() + '\n', encoding='utf-8')

      - name: Commit validation record and remove temporary workflow
        run: |
          git rm .github/workflows/temp-keycard-hardening-validation-record.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git commit -m "Record hardened keycard source validation"
          git push origin HEAD:feature/keycard-reader-light-feedback
