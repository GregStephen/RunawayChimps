name: Temporary keycard collider inspection

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - '.github/workflows/temp-inspect-keycard-colliders.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback

      - name: Inspect Level 1 reader and wall parent transforms
        shell: python
        run: |
          from pathlib import Path
          import re

          scene = Path('Assets/Scenes/Level1_Containment.unity').read_text(encoding='utf-8-sig')
          blocks = [b for b in re.split(r'(?=^--- !u!)', scene, flags=re.M) if b.startswith('--- !u!')]
          by_id = {}
          for block in blocks:
              match = re.match(r'--- !u!\d+ &(-?\d+)', block.splitlines()[0])
              if match:
                  by_id[int(match.group(1))] = block

          for transform_id in (602973297, 2122819246, 1927466659):
              print('\n### TRANSFORM', transform_id)
              print(by_id.get(transform_id, '<missing>'))

          # Also print GameObjects owned by these transforms when available.
          for transform_id in (602973297, 2122819246, 1927466659):
              block = by_id.get(transform_id, '')
              go = re.search(r'm_GameObject: \{fileID: (-?\d+)\}', block)
              if go:
                  print('\n### GAMEOBJECT FOR', transform_id)
                  print(by_id.get(int(go.group(1)), '<missing>'))
