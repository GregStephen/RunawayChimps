name: Temporary keycard collider inspection

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - '.github/workflows/temp-inspect-keycard-colliders.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback

      - name: Inspect wall instances around Level 1 reader
        shell: python
        run: |
          from pathlib import Path
          import re

          scene = Path('Assets/Scenes/Level1_Containment.unity').read_text(encoding='utf-8-sig')
          blocks = [b for b in re.split(r'(?=^--- !u!)', scene, flags=re.M) if b.startswith('--- !u!')]
          for wanted in ('LabWall (12)', 'LabWall (13)', 'LabWall (23)', 'LabWall (24)', 'LabWall (25)', 'Level2_Entrance_Door', 'Reader_Amber_Triangle'):
              print('\n###', wanted)
              found = False
              for block in blocks:
                  if not block.startswith('--- !u!1001'):
                      continue
                  if re.search(r'propertyPath: m_Name\n\s*value: ' + re.escape(wanted) + r'\s*$', block, re.M):
                      print(block)
                      found = True
              if not found:
                  print('<not found>')
