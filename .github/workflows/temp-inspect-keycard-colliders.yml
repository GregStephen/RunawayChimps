name: Temporary keycard collider inspection

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - '.github/workflows/temp-inspect-keycard-colliders.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback

      - name: Inspect colliders belonging to walls around Level 1 reader
        shell: python
        run: |
          from pathlib import Path
          import re

          scene = Path('Assets/Scenes/Level1_Containment.unity').read_text(encoding='utf-8-sig')
          blocks = [b for b in re.split(r'(?=^--- !u!)', scene, flags=re.M) if b.startswith('--- !u!')]
          by_id = {}
          for block in blocks:
              match = re.match(r'--- !u!\d+ &(-?\d+)', block.splitlines()[0])
              if match:
                  by_id[int(match.group(1))] = block

          wall_component_ids = {
              'LabWall (12)': 1053882261,
              'LabWall (13)': 916541124,
              'LabWall (23)': 713069941,
              'LabWall (24)': 358216536,
              'LabWall (25)': 765382315,
          }
          for name, component_id in wall_component_ids.items():
              print('\n###', name, 'added collider/component', component_id)
              print(by_id.get(component_id, '<missing>'))

          print('\n### components referencing reader-adjacent prefab stripped objects')
          for block in blocks:
              if not re.match(r'--- !u!(64|65|135|136) &', block.splitlines()[0]):
                  continue
              if any(token in block for token in ('1053882261','916541124','713069941','358216536','765382315')):
                  print(block)
