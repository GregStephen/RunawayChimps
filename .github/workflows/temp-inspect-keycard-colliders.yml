name: Temporary keycard collider inspection

on:
  push:
    branches:
      - feature/keycard-reader-light-feedback
    paths:
      - '.github/workflows/temp-inspect-keycard-colliders.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keycard-reader-light-feedback

      - name: Inspect Level 2 gate colliders near keycard reader
        shell: python
        run: |
          from pathlib import Path
          import re

          scene = Path('Assets/Scenes/Level1_Containment.unity').read_text(encoding='utf-8-sig')
          blocks = [b for b in re.split(r'(?=^--- !u!)', scene, flags=re.M) if b.startswith('--- !u!')]
          by_id = {}
          for block in blocks:
              match = re.match(r'--- !u!\d+ &(-?\d+)', block.splitlines()[0])
              if match:
                  by_id[int(match.group(1))] = block

          for component_id in (702843213, 702843214, 341390862, 1298815337):
              print('\n### GATE ADDED COMPONENT', component_id)
              print(by_id.get(component_id, '<missing>'))

          for go_id in (702843206, 702843207, 702843208, 702843209, 702843210, 702843211, 702843212):
              if go_id in by_id:
                  print('\n### GATE SCENE OBJECT/TRANSFORM', go_id)
                  print(by_id[go_id])
