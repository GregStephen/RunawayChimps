name: Cognitive review snapshot
on:
  push:
    branches: [feature/primate-cognitive-test]
    paths: [.github/workflows/cognitive-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package review source and managed diagnostic compiler
        shell: bash
        run: |
          mkdir -p /tmp/cognitive-review
          git rev-parse HEAD > /tmp/cognitive-review/head.txt
          git ls-files -s > /tmp/cognitive-review/tracked-index.txt
          git ls-files -z | python -c 'import sys; paths=sys.stdin.buffer.read().split(b"\0"); wanted=[p for p in paths if p and (p.endswith((b".cs",b".meta",b".prefab",b".unity",b".mat",b".shader",b".asmdef",b".asmref",b".md",b".json",b".yml",b".py",b".csproj",b".txt",b".asset")) or p.startswith((b"ProjectSettings/",b"Packages/",b"Tools/",b"Assets/RunawayChimps/Toys/PrimateCognitive/")) or p in (b".gitignore", b".gitattributes"))]; sys.stdout.buffer.write(b"\0".join(wanted)+b"\0")' > /tmp/cognitive-files
          tar --null -T /tmp/cognitive-files -czf /tmp/cognitive-review/source.tar.gz
          runtime=$(find /usr/share/dotnet/shared/Microsoft.NETCore.App -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          sdk=$(find /usr/share/dotnet/sdk -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          ref=$(find /usr/share/dotnet/packs/Microsoft.NETCore.App.Ref -maxdepth 1 -type d -name '8.*' | sort -V | tail -1)
          test -n "$runtime" && test -n "$sdk" && test -n "$ref"
          tar -C /usr/share/dotnet -czf /tmp/cognitive-review/managed-compiler.tar.gz dotnet host "${runtime#/usr/share/dotnet/}" "${sdk#/usr/share/dotnet/}/Roslyn/bincore" "${ref#/usr/share/dotnet/}"
      - uses: actions/upload-artifact@v4
        with:
          name: cognitive-review-snapshot
          path: /tmp/cognitive-review/
          retention-days: 1
