name: One-off fix vent blower materials

on:
  push:
    branches:
      - feature/level1-vent-blower
    paths:
      - '.github/workflows/oneoff-fix-vent-blower-materials.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/level1-vent-blower
          fetch-depth: 0

      - name: Add built-in Standard materials and wire FBX importer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          MAT_DIR = ROOT / 'Assets/RunawayChimps/Shared/Models/Materials'

          materials = [
              ('VentBlower_DarkPaintedMetal', '8cf5047b731f41878bbc98a1b560e857', (0.075, 0.082, 0.085, 1.0), 0.25, 0.18, (0,0,0,1), False, 'M_DarkPaintedMetal'),
              ('VentBlower_DullSteel', '64ff90c7d4224576b71d20d07c72f147', (0.17, 0.18, 0.18, 1.0), 0.55, 0.26, (0,0,0,1), False, 'M_DullSteel'),
              ('VentBlower_FanBlade', 'a6c3ee28ed524942b5f6703bd4faf6dc', (0.12, 0.125, 0.12, 1.0), 0.45, 0.21, (0,0,0,1), False, 'M_FanBlade'),
              ('VentBlower_Conduit', 'ebfeb091156a4fba93392bce6efac492', (0.035, 0.038, 0.04, 1.0), 0.10, 0.10, (0,0,0,1), False, 'M_Conduit'),
              ('VentBlower_RedMaintenanceLens', '777e48d39cf141f98321517a14ca7519', (0.35, 0.01, 0.008, 1.0), 0.0, 0.40, (2.6,0.035,0.02,1.0), True, 'M_RedMaintenanceLens'),
          ]

          def material_yaml(name, color, metallic, smoothness, emission, use_emission):
              keywords = '  - _EMISSION\n' if use_emission else '  m_ValidKeywords: []\n'
              if use_emission:
                  keyword_block = '  m_ValidKeywords:\n' + keywords
              else:
                  keyword_block = keywords
              r,g,b,a = color
              er,eg,eb,ea = emission
              return f'''%YAML 1.1
%TAG !u! tag:unity3d.com,2011:
--- !u!21 &2100000
Material:
  serializedVersion: 8
  m_ObjectHideFlags: 0
  m_CorrespondingSourceObject: {{fileID: 0}}
  m_PrefabInstance: {{fileID: 0}}
  m_PrefabAsset: {{fileID: 0}}
  m_Name: {name}
  m_Shader: {{fileID: 46, guid: 0000000000000000f000000000000000, type: 0}}
  m_Parent: {{fileID: 0}}
  m_ModifiedSerializedProperties: 0
{keyword_block}  m_InvalidKeywords: []
  m_LightmapFlags: 4
  m_EnableInstancingVariants: 1
  m_DoubleSidedGI: 0
  m_CustomRenderQueue: -1
  stringTagMap: {{}}
  disabledShaderPasses: []
  m_LockedProperties: 
  m_SavedProperties:
    serializedVersion: 3
    m_TexEnvs:
    - _BumpMap:
        m_Texture: {{fileID: 0}}
        m_Scale: {{x: 1, y: 1}}
        m_Offset: {{x: 0, y: 0}}
    - _DetailAlbedoMap:
        m_Texture: {{fileID: 0}}
        m_Scale: {{x: 1, y: 1}}
        m_Offset: {{x: 0, y: 0}}
    - _DetailMask:
        m_Texture: {{fileID: 0}}
        m_Scale: {{x: 1, y: 1}}
        m_Offset: {{x: 0, y: 0}}
    - _DetailNormalMap:
        m_Texture: {{fileID: 0}}
        m_Scale: {{x: 1, y: 1}}
        m_Offset: {{x: 0, y: 0}}
    - _EmissionMap:
        m_Texture: {{fileID: 0}}
        m_Scale: {{x: 1, y: 1}}
        m_Offset: {{x: 0, y: 0}}
    - _MainTex:
        m_Texture: {{fileID: 0}}
        m_Scale: {{x: 1, y: 1}}
        m_Offset: {{x: 0, y: 0}}
    - _MetallicGlossMap:
        m_Texture: {{fileID: 0}}
        m_Scale: {{x: 1, y: 1}}
        m_Offset: {{x: 0, y: 0}}
    - _OcclusionMap:
        m_Texture: {{fileID: 0}}
        m_Scale: {{x: 1, y: 1}}
        m_Offset: {{x: 0, y: 0}}
    - _ParallaxMap:
        m_Texture: {{fileID: 0}}
        m_Scale: {{x: 1, y: 1}}
        m_Offset: {{x: 0, y: 0}}
    m_Ints: []
    m_Floats:
    - _BumpScale: 1
    - _Cutoff: 0.5
    - _DetailNormalMapScale: 1
    - _DstBlend: 0
    - _GlossMapScale: 1
    - _Glossiness: {smoothness}
    - _GlossyReflections: 1
    - _Metallic: {metallic}
    - _Mode: 0
    - _OcclusionStrength: 1
    - _Parallax: 0.02
    - _SmoothnessTextureChannel: 0
    - _SpecularHighlights: 1
    - _SrcBlend: 1
    - _UVSec: 0
    - _ZWrite: 1
    m_Colors:
    - _Color: {{r: {r}, g: {g}, b: {b}, a: {a}}}
    - _EmissionColor: {{r: {er}, g: {eg}, b: {eb}, a: {ea}}}
  m_BuildTextureStacks: []
'''

          for file_name, guid, color, metallic, smoothness, emission, use_emission, _ in materials:
              (MAT_DIR / f'{file_name}.mat').write_text(
                  material_yaml(file_name, color, metallic, smoothness, emission, use_emission), encoding='utf-8')
              (MAT_DIR / f'{file_name}.mat.meta').write_text(
                  f'fileFormatVersion: 2\nguid: {guid}\nNativeFormatImporter:\n  externalObjects: {{}}\n  mainObjectFileID: 2100000\n  userData: \n  assetBundleName: \n  assetBundleVariant: \n',
                  encoding='utf-8')

          fbx_meta_path = ROOT / 'Assets/Resources/RunawayChimps_VentBlower.fbx.meta'
          fbx_meta = fbx_meta_path.read_text(encoding='utf-8')
          external = ['  externalObjects:']
          for _, guid, *_rest, imported_name in materials:
              external.extend([
                  '  - first:',
                  '      type: UnityEngine:Material',
                  '      assembly: UnityEngine.CoreModule',
                  f'      name: {imported_name}',
                  f'    second: {{fileID: 2100000, guid: {guid}, type: 2}}',
              ])
          external_block = '\n'.join(external)
          fbx_meta = fbx_meta.replace('  externalObjects: {}', external_block, 1)
          fbx_meta_path.write_text(fbx_meta, encoding='utf-8')

          controller_path = ROOT / 'Assets/Scripts/Lighting/VentBlowerSetPiece.cs'
          controller = controller_path.read_text(encoding='utf-8')
          controller = controller.replace('using System.Collections.Generic;\n', '')
          controller = re.sub(r'\n    private readonly List<Material> ownedMaterials = new List<Material>\(5\);', '', controller)
          controller = re.sub(r'\n    private void OnDestroy\(\)\n    \{.*?\n    \}\n\n    private void BuildBlower', '\n    private void BuildBlower', controller, flags=re.S)

          replacement_config = '''    private void ConfigureImportedVisual(GameObject visualRoot)
    {
        // The FBX is decorative environmental art. Never allow imported/generated colliders to
        // obstruct Gorilla locomotion or the Crawler's already-approved route through VentRoom.
        Collider[] colliders = visualRoot.GetComponentsInChildren<Collider>(true);
        foreach (Collider collider in colliders)
        {
            collider.enabled = false;
            Destroy(collider);
        }

        // Materials are serialized Unity Standard materials mapped directly by the FBX importer.
        // This project currently uses the built-in render pipeline, so assigning URP/Lit here would
        // render magenta even though the URP package is installed.
        Renderer[] renderers = visualRoot.GetComponentsInChildren<Renderer>(true);
        foreach (Renderer renderer in renderers)
        {
            renderer.shadowCastingMode = ShadowCastingMode.Off;
            renderer.receiveShadows = false;
            renderer.lightProbeUsage = LightProbeUsage.Off;
            renderer.reflectionProbeUsage = ReflectionProbeUsage.Off;

            foreach (Material material in renderer.sharedMaterials)
            {
                if (material == null || material.shader == null || !material.shader.isSupported)
                    Debug.LogError($"[VentBlowerSetPiece] Imported blower material on '{renderer.name}' is missing or uses an unsupported shader.");
            }
        }
    }

'''
          controller = re.sub(
              r'    private void ConfigureImportedVisual\(GameObject visualRoot\)\n    \{.*?\n    \}\n\n    private static Material ResolveMaterial.*?\n    private void CreateMaintenanceLight',
              replacement_config + '    private void CreateMaintenanceLight',
              controller,
              flags=re.S,
          )
          controller_path.write_text(controller, encoding='utf-8')

          validator_path = ROOT / 'Tools/validate_level1_contracts.py'
          validator = validator_path.read_text(encoding='utf-8-sig')
          start = validator.index('    blower_path = ROOT / "Assets/Scripts/Lighting/VentBlowerSetPiece.cs"')
          end = validator.index('    nav_path = ROOT / "Assets/Scripts/MonsterScripts/MonsterNavigation.cs"')
          mat_specs = [(m[0], m[1], m[-1]) for m in materials]
          block = '''    blower_path = ROOT / "Assets/Scripts/Lighting/VentBlowerSetPiece.cs"
    blower = require(errors, blower_path, [
        'LevelOneScene = "Level1_Containment"',
        'VentRoomName = "VentRoom"',
        'RuntimeRootName = "Level1_VentRoom_Blower"',
        'BlowerResourcePath = "RunawayChimps_VentBlower"',
        'RotorName = "FanRotor"',
        'RedLensName = "RedLightLens"',
        "BlowerLocalPosition = new Vector3(-0.25f, 0.72f, 22.46f)",
        "Resources.Load<GameObject>(BlowerResourcePath)",
        "Instantiate(blowerPrefab, transform, false)",
        "OrientVisualIntoVentRoom(visualInstance.transform)",
        "GetComponentsInChildren<Collider>(true)",
        "collider.enabled = false;",
        "ShadowCastingMode.Off",
        "material.shader.isSupported",
        "LightType.Point",
        "LightShadows.None",
        "bounceIntensity = 0f",
        "spatialBlend = 1f",
        "maxDistance = 6.5f",
        'AudioClip.Create("Vent_Blower_ProceduralLoop"',
    ])
    if re.search(r"^using\\s+Photon\\.", blower, re.M):
        errors.append(f"{rel(blower_path)}: decorative vent blower must not depend on Photon.")
    if "GameObject.CreatePrimitive(" in blower:
        errors.append(f"{rel(blower_path)}: approved Blender visual must not regress to generated primitive geometry.")
    if 'Shader.Find("Universal Render Pipeline/Lit")' in blower:
        errors.append(f"{rel(blower_path)}: blower must not dynamically assign URP/Lit while the project uses the built-in render pipeline.")
    if "CreateRuntimeMaterial(" in blower:
        errors.append(f"{rel(blower_path)}: blower materials must stay serialized/import-mapped rather than dynamically created.")
    positive_defaults(errors, blower_path, blower, ["FanDegreesPerSecond", "BaseRedLightIntensity"])

    graphics_path = ROOT / "ProjectSettings/GraphicsSettings.asset"
    graphics = require(errors, graphics_path, ["m_CustomRenderPipeline: {fileID: 0}"])
    quality_path = ROOT / "ProjectSettings/QualitySettings.asset"
    quality = require(errors, quality_path, ["customRenderPipeline: {fileID: 0}"])

    blower_asset = ROOT / "Assets/Resources/RunawayChimps_VentBlower.fbx"
    blower_meta = ROOT / "Assets/Resources/RunawayChimps_VentBlower.fbx.meta"
    if not blower_asset.exists():
        errors.append(f"{rel(blower_asset)}: approved Blender FBX resource is missing.")
    elif blower_asset.stat().st_size < 10000:
        errors.append(f"{rel(blower_asset)}: approved Blender FBX resource is unexpectedly small.")
    meta = require(errors, blower_meta, [
        "ModelImporter:",
        "addColliders: 0",
        "importCameras: 0",
        "importLights: 0",
        "preserveHierarchy: 1",
    ])
    if meta:
        guid(blower_meta, errors)

'''
          for file_name, guid_value, imported_name in mat_specs:
              block += f'''    blower_mat = ROOT / "Assets/RunawayChimps/Shared/Models/Materials/{file_name}.mat"
    blower_mat_meta = ROOT / "Assets/RunawayChimps/Shared/Models/Materials/{file_name}.mat.meta"
    require(errors, blower_mat, [
        "m_Shader: {{fileID: 46, guid: 0000000000000000f000000000000000, type: 0}}",
    ])
    blower_mat_guid = guid(blower_mat_meta, errors)
    if blower_mat_guid and meta:
        if f"name: {imported_name}" not in meta or blower_mat_guid not in meta:
            errors.append(f"{{rel(blower_meta)}}: {imported_name} is not mapped to {file_name}.mat.")

'''
          validator = validator[:start] + block + validator[end:]
          validator_path.write_text(validator, encoding='utf-8')

          design_path = ROOT / 'docs/design-and-lore.md'
          design = design_path.read_text(encoding='utf-8')
          design_marker = '**September 12 automated source-validation follow-up:**'
          correction = '''**September 13 VentRoom blower pink-material correction:** Greg's Unity test invalidated the earlier runtime "URP-safe material" assumption: the authored blower rendered pink. Repository inspection confirms Runaway Chimps currently uses Unity's **built-in render pipeline** (`GraphicsSettings.m_CustomRenderPipeline = 0`, and every quality tier has `customRenderPipeline = 0`) even though the URP package is installed. `Shader.Find("Universal Render Pipeline/Lit")` could therefore succeed by package presence while producing magenta under the active renderer. That approach is superseded. PR #17 now uses five serialized Unity **Standard** materials mapped directly to the FBX importer (`M_DarkPaintedMetal`, `M_DullSteel`, `M_FanBlade`, `M_Conduit`, `M_RedMaintenanceLens`). Runtime code no longer creates or assigns a render-pipeline shader; it only verifies the imported materials are present/supported. This is an implemented correction awaiting Greg's Unity retest; do not mark the pink-material defect resolved until the imported model and Play Mode both render normally.\n\n'''
          if correction not in design:
              design = design.replace(design_marker, correction + design_marker, 1)
          table_marker = '| Recorded | Decision or correction | Status |\n| --- | --- | --- |\n'
          row = '| 2026-09-13 | The Level 1 blower must use materials compatible with the project\'s active built-in render pipeline. Package installation alone must not be treated as proof that URP is active; do not dynamically assign `Universal Render Pipeline/Lit` while `m_CustomRenderPipeline` is zero. | Confirmed from Greg\'s pink-material runtime failure. PR #17 now maps five serialized Standard materials directly in the FBX importer; Unity retest pending. |\n'
          if row not in design:
              design = design.replace(table_marker, table_marker + row, 1)
          design_path.write_text(design, encoding='utf-8')

          plan_path = ROOT / 'docs/repository-improvement-plan.md'
          plan = plan_path.read_text(encoding='utf-8')
          plan_marker = '## September 12 automated source validation'
          section = '''## September 13 VentRoom blower material runtime correction\n\n**Failed runtime validation:** Greg reports the authored Level 1 blower is pink in Unity. This supersedes the prior claim that assigning a runtime `Universal Render Pipeline/Lit` material made the asset pipeline-safe.\n\n**Root cause:** `ProjectSettings/GraphicsSettings.asset` has `m_CustomRenderPipeline: {fileID: 0}`, and every tier in `QualitySettings.asset` has `customRenderPipeline: {fileID: 0}`. The active game renderer is therefore Unity's built-in pipeline. URP is installed as a package, so `Shader.Find("Universal Render Pipeline/Lit")` can still return that shader; assigning it under the built-in renderer produces magenta. Known working project materials use the built-in Standard shader (`fileID: 46`).\n\n**Implemented correction on PR #17:** add five real serialized Standard `.mat` assets for the approved blower colors/material roles and map them directly to the FBX material names through `RunawayChimps_VentBlower.fbx.meta`. `VentBlowerSetPiece` no longer creates/replaces materials at runtime and no longer references URP/Lit; it retains only collider suppression, shadow/probe-cost settings, rotor animation, red point light, and motor audio. Source contracts now protect the current built-in render-pipeline setting, each Standard material, importer GUID mapping, and the absence of dynamic URP/material creation.\n\n**Pending validation:** reimport/refresh the FBX in Unity 2022.3.55f1 if needed, then confirm the model is non-pink in the Project/Scene view and in Play Mode; verify the five material roles look like the approved preview, the red lens remains readable, and the fan/light/audio behavior is unchanged. The defect remains open until that runtime retest passes.\n\n'''
          if section not in plan:
              plan = plan.replace(plan_marker, section + plan_marker, 1)
          plan_path.write_text(plan, encoding='utf-8')
          PY

          git config user.name "Greg Stephen"
          git config user.email "35859167+GregStephen@users.noreply.github.com"
          git add Assets/Scripts/Lighting/VentBlowerSetPiece.cs \
                  Assets/Resources/RunawayChimps_VentBlower.fbx.meta \
                  Assets/RunawayChimps/Shared/Models/Materials/VentBlower_*.mat \
                  Assets/RunawayChimps/Shared/Models/Materials/VentBlower_*.mat.meta \
                  Tools/validate_level1_contracts.py \
                  docs/design-and-lore.md docs/repository-improvement-plan.md
          git rm .github/workflows/oneoff-fix-vent-blower-materials.yml
          git commit -m "Fix vent blower materials for built-in renderer"
          git push origin HEAD:feature/level1-vent-blower
