name: One-off fix vent blower materials

on:
  push:
    branches:
      - feature/level1-vent-blower
    paths:
      - '.github/workflows/oneoff-fix-vent-blower-materials.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/level1-vent-blower
          fetch-depth: 0

      - name: Bind Standard materials and remove URP runtime override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          mappings = [
              ('M_DarkPaintedMetal', '8cf5047b731f41878bbc98a1b560e857', 'VentBlower_DarkPaintedMetal'),
              ('M_DullSteel', '64ff90c7d4224576b71d20d07c72f147', 'VentBlower_DullSteel'),
              ('M_FanBlade', 'a6c3ee28ed524942b5f6703bd4faf6dc', 'VentBlower_FanBlade'),
              ('M_Conduit', 'ebfeb091156a4fba93392bce6efac492', 'VentBlower_Conduit'),
              ('M_RedMaintenanceLens', '777e48d39cf141f98321517a14ca7519', 'VentBlower_RedMaintenanceLens'),
          ]

          meta_path = Path('Assets/Resources/RunawayChimps_VentBlower.fbx.meta')
          meta = meta_path.read_text(encoding='utf-8')
          if '  externalObjects: {}' not in meta:
              raise SystemExit('Expected empty FBX externalObjects block was not found.')
          external = ['  externalObjects:']
          for imported_name, guid_value, _ in mappings:
              external += [
                  '  - first:',
                  '      type: UnityEngine:Material',
                  '      assembly: UnityEngine.CoreModule',
                  '      name: ' + imported_name,
                  '    second: {fileID: 2100000, guid: ' + guid_value + ', type: 2}',
              ]
          meta = meta.replace('  externalObjects: {}', '\n'.join(external), 1)
          meta = meta.replace('userData: approved-simple-chunky-vent-blower-visual', 'userData: approved-simple-chunky-vent-blower-visual; built-in-standard-material-mapping')
          meta_path.write_text(meta, encoding='utf-8')

          controller_path = Path('Assets/Scripts/Lighting/VentBlowerSetPiece.cs')
          controller = controller_path.read_text(encoding='utf-8')
          controller = controller.replace('using System.Collections.Generic;\n', '')
          controller = controller.replace('    private readonly List<Material> ownedMaterials = new List<Material>(5);\n', '')
          controller = re.sub(r'\n    private void OnDestroy\(\)\n    \{.*?\n    \}\n', '\n', controller, flags=re.S)
          start = controller.index('    private void ConfigureImportedVisual(GameObject visualRoot)')
          end = controller.index('    private void CreateMaintenanceLight(Transform anchor)')
          replacement = '\n'.join([
              '    private void ConfigureImportedVisual(GameObject visualRoot)',
              '    {',
              '        // The FBX is decorative environmental art. Never allow imported/generated colliders to',
              "        // obstruct Gorilla locomotion or the Crawler's already-approved route through VentRoom.",
              '        Collider[] colliders = visualRoot.GetComponentsInChildren<Collider>(true);',
              '        foreach (Collider collider in colliders)',
              '        {',
              '            collider.enabled = false;',
              '            Destroy(collider);',
              '        }',
              '',
              '        // Materials are serialized Unity Standard materials mapped directly by the FBX importer.',
              '        // Runaway Chimps currently uses the built-in render pipeline; URP is installed but inactive.',
              '        Renderer[] renderers = visualRoot.GetComponentsInChildren<Renderer>(true);',
              '        foreach (Renderer renderer in renderers)',
              '        {',
              '            renderer.shadowCastingMode = ShadowCastingMode.Off;',
              '            renderer.receiveShadows = false;',
              '            renderer.lightProbeUsage = LightProbeUsage.Off;',
              '            renderer.reflectionProbeUsage = ReflectionProbeUsage.Off;',
              '',
              '            foreach (Material material in renderer.sharedMaterials)',
              '            {',
              '                if (material == null || material.shader == null || !material.shader.isSupported)',
              '                    Debug.LogError($"[VentBlowerSetPiece] Imported blower material on \'{renderer.name}\' is missing or uses an unsupported shader.");',
              '            }',
              '        }',
              '    }',
              '',
          ])
          controller = controller[:start] + replacement + controller[end:]
          controller_path.write_text(controller, encoding='utf-8')

          validator_path = Path('Tools/validate_level1_contracts.py')
          validator = validator_path.read_text(encoding='utf-8-sig')
          start = validator.index('    blower_path = ROOT / "Assets/Scripts/Lighting/VentBlowerSetPiece.cs"')
          end = validator.index('    nav_path = ROOT / "Assets/Scripts/MonsterScripts/MonsterNavigation.cs"')
          lines = [
              '    blower_path = ROOT / "Assets/Scripts/Lighting/VentBlowerSetPiece.cs"',
              '    blower = require(errors, blower_path, [',
              "        'LevelOneScene = \"Level1_Containment\"',",
              "        'VentRoomName = \"VentRoom\"',",
              "        'RuntimeRootName = \"Level1_VentRoom_Blower\"',",
              "        'BlowerResourcePath = \"RunawayChimps_VentBlower\"',",
              "        'RotorName = \"FanRotor\"',",
              "        'RedLensName = \"RedLightLens\"',",
              '        "BlowerLocalPosition = new Vector3(-0.25f, 0.72f, 22.46f)",',
              '        "Resources.Load<GameObject>(BlowerResourcePath)",',
              '        "Instantiate(blowerPrefab, transform, false)",',
              '        "OrientVisualIntoVentRoom(visualInstance.transform)",',
              '        "GetComponentsInChildren<Collider>(true)",',
              '        "collider.enabled = false;",',
              '        "ShadowCastingMode.Off",',
              '        "material.shader.isSupported",',
              '        "LightType.Point",',
              '        "LightShadows.None",',
              '        "bounceIntensity = 0f",',
              '        "spatialBlend = 1f",',
              '        "maxDistance = 6.5f",',
              "        'AudioClip.Create(\"Vent_Blower_ProceduralLoop\"',",
              '    ])',
              '    if re.search(r"^using\\s+Photon\\.", blower, re.M):',
              '        errors.append(f"{rel(blower_path)}: decorative vent blower must not depend on Photon.")',
              '    if "GameObject.CreatePrimitive(" in blower:',
              '        errors.append(f"{rel(blower_path)}: approved Blender visual must not regress to generated primitive geometry.")',
              '    if \'Shader.Find("Universal Render Pipeline/Lit")\' in blower:',
              '        errors.append(f"{rel(blower_path)}: blower must not dynamically assign URP/Lit while the project uses the built-in render pipeline.")',
              '    if "CreateRuntimeMaterial(" in blower:',
              '        errors.append(f"{rel(blower_path)}: blower materials must stay serialized/import-mapped rather than dynamically created.")',
              '    positive_defaults(errors, blower_path, blower, ["FanDegreesPerSecond", "BaseRedLightIntensity"])',
              '',
              '    graphics_path = ROOT / "ProjectSettings/GraphicsSettings.asset"',
              '    require(errors, graphics_path, ["m_CustomRenderPipeline: {fileID: 0}"])',
              '    quality_path = ROOT / "ProjectSettings/QualitySettings.asset"',
              '    require(errors, quality_path, ["customRenderPipeline: {fileID: 0}"])',
              '',
              '    blower_asset = ROOT / "Assets/Resources/RunawayChimps_VentBlower.fbx"',
              '    blower_meta = ROOT / "Assets/Resources/RunawayChimps_VentBlower.fbx.meta"',
              '    if not blower_asset.exists():',
              '        errors.append(f"{rel(blower_asset)}: approved Blender FBX resource is missing.")',
              '    elif blower_asset.stat().st_size < 10000:',
              '        errors.append(f"{rel(blower_asset)}: approved Blender FBX resource is unexpectedly small.")',
              '    meta = require(errors, blower_meta, ["ModelImporter:", "addColliders: 0", "importCameras: 0", "importLights: 0", "preserveHierarchy: 1"])',
              '    if meta:',
              '        guid(blower_meta, errors)',
              '',
          ]
          for imported_name, guid_value, file_name in mappings:
              lines += [
                  '    blower_mat = ROOT / "Assets/RunawayChimps/Shared/Models/Materials/' + file_name + '.mat"',
                  '    blower_mat_meta = ROOT / "Assets/RunawayChimps/Shared/Models/Materials/' + file_name + '.mat.meta"',
                  '    require(errors, blower_mat, ["m_Shader: {fileID: 46, guid: 0000000000000000f000000000000000, type: 0}"])',
                  '    blower_mat_guid = guid(blower_mat_meta, errors)',
                  '    if blower_mat_guid and meta:',
                  '        if "name: ' + imported_name + '" not in meta or blower_mat_guid not in meta:',
                  '            errors.append(f"{rel(blower_meta)}: ' + imported_name + ' is not mapped to ' + file_name + '.mat.")',
                  '',
              ]
          validator = validator[:start] + '\n'.join(lines) + '\n' + validator[end:]
          validator_path.write_text(validator, encoding='utf-8')

          design_path = Path('docs/design-and-lore.md')
          design = design_path.read_text(encoding='utf-8')
          marker = '**September 12 automated source-validation follow-up:**'
          correction = ("**September 13 VentRoom blower pink-material correction:** Greg's Unity test invalidated the earlier runtime `URP-safe material` assumption: the authored blower rendered pink. Repository inspection confirms Runaway Chimps currently uses Unity's **built-in render pipeline** (`GraphicsSettings.m_CustomRenderPipeline = 0`, and every quality tier has `customRenderPipeline = 0`) even though the URP package is installed. `Shader.Find(\"Universal Render Pipeline/Lit\")` could therefore succeed by package presence while producing magenta under the active renderer. That approach is superseded. PR #17 now uses five serialized Unity **Standard** materials mapped directly to the FBX importer (`M_DarkPaintedMetal`, `M_DullSteel`, `M_FanBlade`, `M_Conduit`, `M_RedMaintenanceLens`). Runtime code no longer creates or assigns a render-pipeline shader; it only verifies the imported materials are present/supported. This is an implemented correction awaiting Greg's Unity retest; do not mark the pink-material defect resolved until the imported model and Play Mode both render normally.\n\n")
          if correction not in design:
              design = design.replace(marker, correction + marker, 1)
          design_path.write_text(design, encoding='utf-8')

          plan_path = Path('docs/repository-improvement-plan.md')
          plan = plan_path.read_text(encoding='utf-8')
          marker = '## September 12 automated source validation'
          section = ("## September 13 VentRoom blower material runtime correction\n\n**Failed runtime validation:** Greg reports the authored Level 1 blower is pink in Unity. This supersedes the prior claim that assigning a runtime `Universal Render Pipeline/Lit` material made the asset pipeline-safe.\n\n**Root cause:** `ProjectSettings/GraphicsSettings.asset` has `m_CustomRenderPipeline: {fileID: 0}`, and every tier in `QualitySettings.asset` has `customRenderPipeline: {fileID: 0}`. The active game renderer is therefore Unity's built-in pipeline. URP is installed as a package, so `Shader.Find(\"Universal Render Pipeline/Lit\")` can still return that shader; assigning it under the built-in renderer produces magenta. Known working project materials use the built-in Standard shader (`fileID: 46`).\n\n**Implemented correction on PR #17:** five real serialized Standard `.mat` assets now represent the approved blower material roles and are mapped directly to the FBX material names through `RunawayChimps_VentBlower.fbx.meta`. `VentBlowerSetPiece` no longer creates/replaces materials at runtime and no longer references URP/Lit; it retains collider suppression, shadow/probe-cost settings, rotor animation, red point light, and motor audio. Source contracts protect the built-in render-pipeline setting, each Standard material, importer GUID mapping, and the absence of dynamic URP/material creation.\n\n**Pending validation:** reimport/refresh the FBX in Unity 2022.3.55f1 if needed, then confirm the model is non-pink in the Project/Scene view and in Play Mode; verify the five material roles look like the approved preview, the red lens remains readable, and fan/light/audio behavior is unchanged. The defect remains open until that runtime retest passes.\n\n")
          if section not in plan:
              plan = plan.replace(marker, section + marker, 1)
          plan_path.write_text(plan, encoding='utf-8')
          PY

          git config user.name "Greg Stephen"
          git config user.email "35859167+GregStephen@users.noreply.github.com"
          git add Assets/Resources/RunawayChimps_VentBlower.fbx.meta Assets/Scripts/Lighting/VentBlowerSetPiece.cs Tools/validate_level1_contracts.py docs/design-and-lore.md docs/repository-improvement-plan.md
          git rm .github/workflows/oneoff-fix-vent-blower-materials.yml
          git commit -m "Finish built-in material mapping for vent blower"
          git push origin HEAD:feature/level1-vent-blower
