name: Regenerate Level 2 v0.4 blockout

on:
  push:
    branches:
      - design/level2-expanded-map-v04
    paths:
      - Tools/Level2Blockout/build_level2.py
      - Tools/Level2Blockout/gate_integration.py
      - .github/workflows/level2-v04-regenerate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip level2 regen]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/level2-expanded-map-v04
          fetch-depth: 0
      - name: Regenerate Level 2 assets
        run: python Tools/Level2Blockout/build_level2.py
      - name: Check generated diff
        run: git diff --check
      - name: Commit generated blockout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/RunawayChimps/Level2Blockout Tools/Level2Blockout/layout.json Tools/Level2Blockout/gate_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Regenerate Level 2 v0.4 blockout [skip level2 regen]"
            git push origin HEAD:design/level2-expanded-map-v04
          fi
