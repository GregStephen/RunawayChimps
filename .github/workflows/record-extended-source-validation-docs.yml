name: Record extended source validation docs

on:
  push:
    paths:
      - '.github/workflows/record-extended-source-validation-docs.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-level1-crawler-lighting

      - name: Record extended source checks
        shell: python
        run: |
          from pathlib import Path

          design = Path('docs/design-and-lore.md')
          text = design.read_text(encoding='utf-8')
          old = """**September 12 automated source-validation follow-up:** PR #11 now adds a repository-wide, read-only GitHub Actions `Source integrity` check through `.github/workflows/source-validation.yml`. It verifies the declared Unity 2022.3.55f1 version, runs `Tools/validate_source.py --syntax`, compiles tracked Python tools, and checks the full PR/push diff for whitespace errors. Its first runs caught and led to fixes for a malformed Level 2 floorplan drawing script and trailing whitespace in three newly added Unity metadata files; after those corrections both push and pull-request runs passed. This is source/serialization/tooling validation only and does **not** replace Unity import/compile, the Editor validators, Play Mode, Photon, XR/headset, or Quest performance testing. See [Automated source validation](ci-validation.md).
"""
          new = """**September 12 automated source-validation follow-up:** PR #11 now adds a repository-wide, read-only GitHub Actions `Source integrity` check through `.github/workflows/source-validation.yml`. In addition to the declared Unity 2022.3.55f1 version and `Tools/validate_source.py --syntax`, it now checks the full Unity `Assets` tree for missing/orphaned metadata and duplicate GUIDs, case-insensitive path collisions, package/asmdef/tool JSON, unresolved merge markers, Python-tool syntax, PR/push whitespace, and focused Level 1 source/scene contracts for the headlamp, Crawler path presentation, safe-zone/capture behavior, XR spawn settling and floor-recovery guard. The checks immediately found and led to fixes for a malformed Level 2 floorplan drawing script, metadata whitespace, five tracked `*.png~` face-texture backups, and an orphaned `StreamingAssets.meta`. Push and pull-request runs pass after those corrections. This remains source/serialization/tooling evidence only and does **not** replace Unity import/compile, the Editor validators, Play Mode, Photon, XR/headset, or Quest performance testing. See [Automated source validation](ci-validation.md).
"""
          if old not in text:
              raise SystemExit('design CI paragraph not found')
          design.write_text(text.replace(old, new, 1), encoding='utf-8')

          plan = Path('docs/repository-improvement-plan.md')
          text = plan.read_text(encoding='utf-8')
          old = """**Implemented on `codex/fix-level1-crawler-lighting`:** `.github/workflows/source-validation.yml` adds the read-only **Source integrity** GitHub Actions gate for every pull request, pushes to `main`, `codex/**` and `design/**`, and manual dispatches. It pins Python/tree-sitter dependencies, verifies `ProjectVersion.txt` still declares Unity 2022.3.55f1, runs `python Tools/validate_source.py --syntax`, compiles tracked Python tools, and applies `git diff --check` to the complete PR or pushed range.

**First CI findings and completed fixes:** the first run passed the Unity-version and core source validator but exposed an existing syntax error in `Tools/Level2Blockout/draw_plan.py`, where intended multiline labels contained literal newlines inside single-quoted strings. That script was repaired to use escaped newlines. The next pull-request run exposed trailing whitespace in the new `RigFloorPenetrationGuard`, `VentHeadlampController`, and `CrawlerBodyPathFollower` `.meta` files; those files were normalized rather than weakening the check. After those corrections, both push and pull-request Source integrity runs passed on September 12. At that checkpoint `validate_source.py --syntax` reported 116 first-party C# scripts and 5 enabled scenes passing component-name, metadata/GUID, build-registration, local-reference and C# syntax checks.
"""
          new = """**Implemented on `codex/fix-level1-crawler-lighting`:** `.github/workflows/source-validation.yml` adds the read-only **Source integrity** GitHub Actions gate for every pull request, pushes to `main`, `codex/**` and `design/**`, and manual dispatches. It pins Python/tree-sitter dependencies, verifies `ProjectVersion.txt` still declares Unity 2022.3.55f1, runs `python Tools/validate_source.py --syntax`, scans the complete Unity `Assets` tree for missing/orphaned `.meta` files and duplicate GUIDs, checks case-insensitive path collisions and package/asmdef/tool JSON, runs focused Level 1 source/scene contracts, compiles tracked Python tools, rejects unresolved merge markers, and applies `git diff --check` to the complete PR or pushed range.

**CI findings and completed fixes:** the first runs exposed an existing syntax error in `Tools/Level2Blockout/draw_plan.py` and trailing whitespace in the new `RigFloorPenetrationGuard`, `VentHeadlampController`, and `CrawlerBodyPathFollower` `.meta` files. The expanded repository scan then found five tracked `*.png~` face-texture backup files plus an orphaned `Assets/StreamingAssets.meta`; those stale files were removed. After those corrections both push and pull-request Source integrity runs passed, including the new repository-integrity and Level 1 contract stages. `validate_source.py --syntax` reports 116 first-party C# scripts and 5 enabled scenes passing component-name, metadata/GUID, build-registration, local-reference and C# syntax checks.
"""
          if old not in text:
              raise SystemExit('plan CI section not found')
          text = text.replace(old, new, 1)

          start = text.index('### Targeted automated checks to add')
          end = text.index('### Choices still needed from Greg', start)
          replacement = """### Automated source checks now implemented and remaining gaps

`Tools/validate_level1_contracts.py` now covers the previously planned source-level guards for both safe-boundary/vent restoration logic, Zombie visual anchoring and required `CrawlerBodyPathFollower` behavior, positive trail/teleport/body-follow tuning, guarded Crawler capture/drop behavior, local-only vent-headlamp gating/equip architecture, `RigSpawnSnapper` XR-offset settling and runtime floor-guard installation, and bounded/non-allocating `RigFloorPenetrationGuard` recovery. It also inspects `Level1_Containment` serialization for the expected safe/vent ZoneTrigger components and Crawler capture component. `Tools/validate_repository_integrity.py` adds project-wide Unity GUID/meta pairing, case-collision and JSON checks. Source integrity also rejects unresolved merge markers.

These checks deliberately stop at what source inspection can prove. The runtime animation-bone probe remains a Play Mode/headset check because source inspection cannot prove a standalone `.anim` deforms the imported Generic skeleton. Likewise duplicate-light behavior, actual headlamp illumination, room-scale XR tracking timing, physics-solver behavior, NavMesh/door clearance, Photon synchronization, fades, collision, voice and Quest performance remain Unity/two-client/headset checks. When v0.4 geometry is merged, extend the source/layout checks for its minimum footprint and required connectivity without treating them as Unity/NavMesh validation. A separate Unity-aware CI tier remains optional future work.

"""
          text = text[:start] + replacement + text[end:]
          plan.write_text(text, encoding='utf-8')

      - name: Commit maintained docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Record extended source validation coverage'
            git push origin HEAD:codex/fix-level1-crawler-lighting
          fi
