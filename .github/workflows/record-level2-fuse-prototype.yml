name: Record Level 2 fuse prototype implementation
on:
  push:
    paths:
      - '.github/workflows/record-level2-fuse-prototype.yml'
jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/level2-expanded-map-v04
      - name: Update maintained design and implementation docs
        shell: python
        run: |
          from pathlib import Path
          design=Path('docs/design-and-lore.md')
          s=design.read_text()
          needle='| 2026-09-11 | Approve the current v0.4 room sizing/proportions'
          row='| 2026-09-11 | Implement the approved Level 2 fuse interaction foundation: physical grabbable prototype fuses, socket insertion, resumable lever charging, a shared Level 2 noise-event bus, objective completion tracking, and reusable noisy-search-container hooks. | Implemented on `design/level2-expanded-map-v04` in `649dd0e`; runtime bootstrap wires the current v0.4 markers without final art/audio or Listener response. Unity 2022.3.55f1, XR ergonomics, capture/drop integration, personal Photon presentation and powered-exit behavior remain pending. |\n'
          if row not in s:
              s=s.replace(needle,row+needle)
              design.write_text(s)
          plan=Path('docs/repository-improvement-plan.md')
          p=plan.read_text()
          old='**Implemented on `design/level2-expanded-map-v04` for review:** the Repair Lab is deepened to approximately 16 × 10 m; the old hammer bench is removed; a central island, four socket/indicator/lever placeholders, a visible exit conduit and four fuse-cache/fuse-start markers are generated into the scene/prefab. The conservative player/Listener box-route validator requires circulation around the island and keeps both Repair Lab escape routes connected. Gameplay components, personal state, noisy container interaction, charge progress, Listener investigation and exit power-up remain unwired.'
          new='**Implemented on `design/level2-expanded-map-v04` for review:** the Repair Lab is deepened to approximately 16 × 10 m; the old hammer bench is removed; a central island, four socket/indicator/lever placeholders, a visible exit conduit and four fuse-cache/fuse-start markers are generated into the scene/prefab. Commit `649dd0e` adds the first functional fuse prototype foundation: runtime-built low-poly grabbable fuse bodies using XRGrabInteractable/HeldItemCollisionMode, physical socket snapping, resumable 10-second prototype lever charging, charge progress/completion events, a reusable Level2NoiseBus for search/fuse-impact/charging events, Level2FuseObjective completion tracking, and noisy-search-container hooks. The runtime bootstrap binds those components to the current v0.4 markers without changing the confirmed room geometry. Listener response, final art/audio, capture-specific fuse release/drop handling, personal Photon presentation and powered-exit activation remain unwired.'
          if old in p:
              p=p.replace(old,new)
          old2='**Pending validation/implementation:** Unity 2022.3.55f1 import, actual gate/island clearance, Gorilla pickup/hold/drop behavior, drawer/cabinet interactions, personal fuse visibility/state, lever ergonomics, charge interruption/resume, Listener sound response,'
          new2='**Pending validation/implementation:** Unity 2022.3.55f1 import/compile, actual gate/island clearance, Gorilla pickup/hold/drop behavior, drawer/cabinet animation/interaction, personal Photon fuse visibility/state, lever ergonomics, capture-specific fuse drop behavior, Listener consumption of the new noise bus, powered-exit response,'
          p=p.replace(old2,new2)
          plan.write_text(p)
      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'Document Level 2 fuse prototype implementation'; git push origin HEAD:design/level2-expanded-map-v04; fi
