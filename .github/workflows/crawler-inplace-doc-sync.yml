name: One-time Crawler in-place docs sync

on:
  push:
    branches:
      - fix/runtime-keycard-crawler-loading
    paths:
      - Tools/sync_crawler_inplace_docs.py
      - .github/workflows/crawler-inplace-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python Tools/sync_crawler_inplace_docs.py
      - name: Commit maintained docs if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/design-and-lore.md docs/repository-improvement-plan.md; then
            echo 'Docs already synchronized.'
            exit 0
          fi
          git config user.name 'Greg Stephen'
          git config user.email '35859167+GregStephen@users.noreply.github.com'
          git add docs/design-and-lore.md docs/repository-improvement-plan.md
          git commit -m 'Record Crawler animation-root drift correction'
          git push origin HEAD:fix/runtime-keycard-crawler-loading
