name: Facility asset authoring (one-time branch preparation)
on:
  push:
    branches: ['feature/facility-announcements']
    paths: ['.github/workflows/facility-authoring-once.yml']
permissions:
  contents: write
jobs:
  author-owned-assets:
    if: github.ref == 'refs/heads/feature/facility-announcements'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline authoring-only synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y espeak
      - name: Create real serialized assets and metadata
        run: python Tools/FacilityAnnouncements/build_assets.py
      - name: Check authored asset references and WAV content
        run: python Tools/FacilityAnnouncements/validate_assets.py
      - name: Publish only this feature's authored assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/RunawayChimps/FacilityAnnouncements Assets/RunawayChimps/FacilityAnnouncements.meta Assets/Scripts/FacilityAnnouncements Assets/Scripts/FacilityAnnouncements.meta
          git commit -m 'feat: serialize facility speaker, captions, materials and original prototype recordings'
          git push origin HEAD:refs/heads/feature/facility-announcements
